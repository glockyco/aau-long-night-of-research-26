<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Billard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: Arial, sans-serif; color: white; user-select: none; }
  h1 { margin-bottom: 6px; font-size: 1.8em; color: #f0c040; }
  #hud { font-size: 1.1em; color: #7ef; margin-bottom: 6px; min-height: 1.5em; letter-spacing: 0.03em; }
  #canvas { border: 8px solid #5a3010; border-radius: 6px; cursor: none; display: block; box-shadow: 0 0 40px #000c; }
  #controls { margin-top: 10px; display: flex; gap: 20px; align-items: center; }
  label { font-size: 1em; color: #ccc; }
  input[type=range] { width: 180px; accent-color: #f0c040; cursor: pointer; }
  #power-val { color: #f0c040; font-weight: bold; min-width: 36px; }
  button { padding: 8px 20px; background: #c0392b; color: white; border: none; border-radius: 6px; font-size: 1em; cursor: pointer; }
  button:hover { background: #e74c3c; }
  #msg { margin-top: 6px; font-size: 1em; color: #f0c040; min-height: 1.4em; }
  #hint { margin-top: 4px; font-size: 0.85em; color: #888; }
</style>
</head>
<body>
<h1>🎱 Billard</h1>
<div id="hud">Bewege die Maus zum Zielen — Klick zum Schießen</div>
<canvas id="canvas" width="860" height="500"></canvas>
<div id="controls">
  <label>Stärke: <input type="range" id="power" min="3" max="30" value="14"></label>
  <span id="power-val">14</span>
  <button id="reset-btn">↺ Neu aufstellen</button>
</div>
<div id="msg"></div>
<div id="hint">Stärke mit dem Schieberegler einstellen · Weißen Ball anklicken zum Schießen</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Table geometry
const RAIL = 32;
const TABLE = { left: RAIL, right: W-RAIL, top: RAIL, bottom: H-RAIL };
const TW = TABLE.right - TABLE.left, TH = TABLE.bottom - TABLE.top;

const BALL_R = 12;
const POCKET_R = 24;
const RESTITUTION = 0.96;   // ball-ball
const WALL_REST   = 0.75;   // wall bounce energy kept
const FRICTION    = 0.988;  // rolling friction per frame
const SUBSTEPS    = 8;      // physics substeps per frame for accuracy

const POCKETS = [
  {x: TABLE.left,   y: TABLE.top},
  {x: TABLE.left + TW/2, y: TABLE.top - 2},
  {x: TABLE.right,  y: TABLE.top},
  {x: TABLE.left,   y: TABLE.bottom},
  {x: TABLE.left + TW/2, y: TABLE.bottom + 2},
  {x: TABLE.right,  y: TABLE.bottom},
];

// 8-ball colors (1-7 solid, 8 black, 9-15 stripe)
const BALL_COLORS = [
  null,
  '#f7c200','#1a3ec4','#c0392b','#6c2c8e','#e67e22','#1a7a1a','#8b1a1a',
  '#111',
  '#f7c200','#1a3ec4','#c0392b','#6c2c8e','#e67e22','#1a7a1a','#8b1a1a'
];

let balls = [];
let mouse = {x: W/2, y: H/2};
let shooting = false;  // balls in motion
let pocketed = [];

function makeBalls() {
  balls = [];
  pocketed = [];
  // Cue ball
  balls.push({ x: TABLE.left + TW*0.27, y: TABLE.top + TH/2,
               vx:0, vy:0, r:BALL_R, color:'#f5f5f5', num:0, stripe:false, gone:false });
  // Rack — tight triangle
  const footX = TABLE.left + TW*0.65;
  const footY = TABLE.top + TH/2;
  const dx = BALL_R * 2 * Math.cos(Math.PI/6); // row step x
  const dy = BALL_R;                             // half row step y
  // Order: 1-15 shuffled (8 in centre)
  const order = [1,9,2,10,8,3,11,4,12,5,13,6,14,7,15];
  let idx = 0;
  for (let row = 0; row < 5; row++) {
    for (let col = 0; col <= row; col++) {
      const bx = footX + row * dx;
      const by = footY - row * dy + col * BALL_R * 2;
      const n = order[idx++];
      balls.push({ x:bx, y:by, vx:0, vy:0, r:BALL_R,
                   color: BALL_COLORS[n], num:n, stripe: n>8, gone:false });
    }
  }
  shooting = false;
}

// ── Physics ────────────────────────────────────────────────────────────────

function stepPhysics(dt) {
  // Move + friction
  for (const b of balls) {
    if (b.gone) continue;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.vx *= Math.pow(FRICTION, dt);
    b.vy *= Math.pow(FRICTION, dt);
    if (Math.abs(b.vx) < 0.01) b.vx = 0;
    if (Math.abs(b.vy) < 0.01) b.vy = 0;

    // Wall collisions (with pocket cut-outs)
    wallBounce(b);

    // Pocket check
    for (const p of POCKETS) {
      const d = hypot(b.x - p.x, b.y - p.y);
      if (d < POCKET_R) {
        b.gone = true; b.vx = 0; b.vy = 0;
        pocketed.push(b.num);
        break;
      }
    }
  }

  // Ball-ball collisions (exact elastic, equal mass)
  const active = balls.filter(b => !b.gone);
  for (let i = 0; i < active.length; i++) {
    for (let j = i+1; j < active.length; j++) {
      const a = active[i], b = active[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = hypot(dx, dy);
      const minD = a.r + b.r;
      if (dist < minD && dist > 0.001) {
        // Separate
        const overlap = (minD - dist) / 2;
        const nx = dx/dist, ny = dy/dist;
        a.x -= nx * overlap; a.y -= ny * overlap;
        b.x += nx * overlap; b.y += ny * overlap;

        // Elastic collision along normal
        const dvx = a.vx - b.vx, dvy = a.vy - b.vy;
        const dot = dvx*nx + dvy*ny;
        if (dot > 0) {
          const impulse = dot * RESTITUTION;
          a.vx -= impulse * nx; a.vy -= impulse * ny;
          b.vx += impulse * nx; b.vy += impulse * ny;
        }
      }
    }
  }
}

function wallBounce(b) {
  // We cut corners near pockets so balls can fall in
  const margin = POCKET_R * 0.7;

  // Left wall
  if (b.x - b.r < TABLE.left) {
    b.x = TABLE.left + b.r;
    b.vx = Math.abs(b.vx) * WALL_REST;
  }
  // Right wall
  if (b.x + b.r > TABLE.right) {
    b.x = TABLE.right - b.r;
    b.vx = -Math.abs(b.vx) * WALL_REST;
  }
  // Top wall
  if (b.y - b.r < TABLE.top) {
    b.y = TABLE.top + b.r;
    b.vy = Math.abs(b.vy) * WALL_REST;
  }
  // Bottom wall
  if (b.y + b.r > TABLE.bottom) {
    b.y = TABLE.bottom - b.r;
    b.vy = -Math.abs(b.vy) * WALL_REST;
  }
}

function hypot(dx, dy) { return Math.sqrt(dx*dx + dy*dy); }

function allStopped() {
  return balls.every(b => b.gone || (b.vx === 0 && b.vy === 0));
}

// ── Aim helpers ─────────────────────────────────────────────────────────────

function getAimDir() {
  const cue = balls[0];
  const dx = mouse.x - cue.x, dy = mouse.y - cue.y;
  const len = hypot(dx, dy);
  if (len < 1) return null;
  return { nx: dx/len, ny: dy/len, len };
}

function angleDegFromDir(nx, ny) {
  // 0° = right, 90° = down, measured clockwise
  let deg = Math.atan2(ny, nx) * 180 / Math.PI;
  return ((deg % 360) + 360) % 360;
}

function compassFromDeg(deg) {
  const sectors = ['Osten','Südosten','Süden','Südwesten','Westen','Nordwesten','Norden','Nordosten'];
  return sectors[Math.round(deg / 45) % 8];
}

// Find where cue ball would first hit another ball (for ghost ball preview)
function findFirstHit(cx, cy, nx, ny) {
  let tMin = Infinity, hitBall = null;
  for (let i = 1; i < balls.length; i++) {
    const b = balls[i];
    if (b.gone) continue;
    // Closest approach along ray
    const dx = b.x - cx, dy = b.y - cy;
    const tca = dx*nx + dy*ny;
    if (tca < 0) continue;
    const d2 = dx*dx + dy*dy - tca*tca;
    const R2 = (BALL_R*2)*(BALL_R*2);
    if (d2 > R2) continue;
    const thc = Math.sqrt(R2 - d2);
    const t = tca - thc;
    if (t > 0 && t < tMin) { tMin = t; hitBall = b; }
  }
  return hitBall ? { t: tMin, ball: hitBall } : null;
}

// ── Drawing ──────────────────────────────────────────────────────────────────

function drawTable() {
  // Wood rail
  ctx.fillStyle = '#5a3010';
  ctx.fillRect(0, 0, W, H);
  // Felt
  ctx.fillStyle = '#1e7a30';
  ctx.fillRect(TABLE.left, TABLE.top, TW, TH);
  // Felt texture lines
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let x = TABLE.left; x < TABLE.right; x += 30) {
    ctx.beginPath(); ctx.moveTo(x, TABLE.top); ctx.lineTo(x, TABLE.bottom); ctx.stroke();
  }
  // Center line
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(TABLE.left + TW/2, TABLE.top);
  ctx.lineTo(TABLE.left + TW/2, TABLE.bottom);
  ctx.stroke();
  // Balk line
  const balkX = TABLE.left + TW*0.27;
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(balkX, TABLE.top); ctx.lineTo(balkX, TABLE.bottom); ctx.stroke();
  // Pockets
  for (const p of POCKETS) {
    ctx.beginPath(); ctx.arc(p.x, p.y, POCKET_R+2, 0, Math.PI*2);
    ctx.fillStyle = '#0a0a0a'; ctx.fill();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
    // Inner shadow ring
    ctx.beginPath(); ctx.arc(p.x, p.y, POCKET_R-2, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 3; ctx.stroke();
  }
  // Rail border
  ctx.strokeStyle = '#7a4a20';
  ctx.lineWidth = 3;
  ctx.strokeRect(TABLE.left, TABLE.top, TW, TH);
}

function lighten(hex, amt) {
  if (!hex.startsWith('#') || hex.length < 7) return hex;
  let r = parseInt(hex.slice(1,3),16)+amt;
  let g = parseInt(hex.slice(3,5),16)+amt;
  let b = parseInt(hex.slice(5,7),16)+amt;
  return `rgb(${clamp(r)},${clamp(g)},${clamp(b)})`;
}
function clamp(v){return Math.max(0,Math.min(255,v));}

function drawBall(b) {
  if (b.gone) return;
  const {x, y, r, color, num, stripe} = b;

  // Shadow
  ctx.beginPath(); ctx.arc(x+3, y+4, r, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill();

  // Base
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  if (stripe) {
    // White ball with stripe band
    ctx.fillStyle = '#f0f0f0'; ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.clip();
    ctx.fillStyle = color;
    ctx.fillRect(x-r, y-r*0.45, r*2, r*0.9);
    ctx.restore();
  } else {
    const g = ctx.createRadialGradient(x-r*0.35, y-r*0.35, r*0.1, x, y, r);
    g.addColorStop(0, lighten(color, 70));
    g.addColorStop(0.6, color);
    g.addColorStop(1, lighten(color, -40));
    ctx.fillStyle = g; ctx.fill();
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.2; ctx.stroke();

  // Specular highlight
  ctx.beginPath(); ctx.arc(x-r*0.32, y-r*0.32, r*0.22, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();

  // Number label
  if (num > 0) {
    if (stripe) {
      ctx.beginPath(); ctx.arc(x, y, r*0.42, 0, Math.PI*2);
      ctx.fillStyle = 'white'; ctx.fill();
    }
    ctx.fillStyle = stripe ? '#222' : (num === 8 ? '#ccc' : 'white');
    ctx.font = `bold ${Math.round(r*0.85)}px Arial`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(num, x, y+0.5);
  }
}

function drawCueStick(cue, nx, ny, power) {
  // Queue goes from behind the cue ball outward in -aim direction
  const pullback = 30 + power * 2;
  const tipX = cue.x - nx * (cue.r + 4);
  const tipY = cue.y - ny * (cue.r + 4);
  const buttX = tipX - nx * pullback;
  const buttY = tipY - ny * pullback;
  // extend stick visually
  const extX = buttX - nx * 180;
  const extY = buttY - ny * 180;

  const g = ctx.createLinearGradient(tipX, tipY, extX, extY);
  g.addColorStop(0, '#e8d080');
  g.addColorStop(0.3, '#c8a050');
  g.addColorStop(1, '#6a3808');

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineWidth = 7;
  ctx.strokeStyle = g;
  ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(extX, extY); ctx.stroke();
  // tip wrap
  ctx.lineWidth = 9;
  ctx.strokeStyle = '#4488cc';
  ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(tipX - nx*6, tipY - ny*6); ctx.stroke();
  ctx.restore();
}

function drawAim() {
  if (shooting) return;
  const cue = balls[0];
  if (cue.gone) return;
  const aim = getAimDir();
  if (!aim) return;
  const {nx, ny} = aim;
  const power = parseInt(document.getElementById('power').value);

  // HUD
  const deg = angleDegFromDir(nx, ny);
  document.getElementById('hud').textContent =
    `Winkel: ${Math.round(deg)}°  ·  Richtung: ${compassFromDeg(deg)}  ·  Klick zum Schießen`;

  // Cue stick (behind ball)
  drawCueStick(cue, nx, ny, power);

  // Ghost ball at first hit
  const hit = findFirstHit(cue.x, cue.y, nx, ny);
  let aimEndX, aimEndY;
  if (hit) {
    aimEndX = cue.x + nx * hit.t;
    aimEndY = cue.y + ny * hit.t;
    // Ghost ball
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(aimEndX, aimEndY, BALL_R, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.restore();

    // Deflection of target ball
    const tb = hit.ball;
    const dnx = (tb.x - aimEndX) / (BALL_R*2);
    const dny = (tb.y - aimEndY) / (BALL_R*2);
    drawDashedLine(tb.x, tb.y, tb.x + dnx*80, tb.y + dny*80, 'rgba(255,200,80,0.6)');
    drawArrowHead(tb.x + dnx*80, tb.y + dny*80, dnx, dny, 'rgba(255,200,80,0.8)');
  } else {
    // Trace to wall
    aimEndX = cue.x + nx * 1000;
    aimEndY = cue.y + ny * 1000;
    // Clamp to walls
    let t = Infinity;
    if (nx>0) t = Math.min(t,(TABLE.right - BALL_R - cue.x)/nx);
    if (nx<0) t = Math.min(t,(TABLE.left + BALL_R - cue.x)/nx);
    if (ny>0) t = Math.min(t,(TABLE.bottom - BALL_R - cue.y)/ny);
    if (ny<0) t = Math.min(t,(TABLE.top + BALL_R - cue.y)/ny);
    aimEndX = cue.x + nx*t; aimEndY = cue.y + ny*t;
  }

  // Main aim line
  drawDashedLine(cue.x, cue.y, aimEndX, aimEndY, 'rgba(255,255,255,0.55)');
  // Direction arrow on line
  const midT = 0.5;
  const mx2 = cue.x + (aimEndX-cue.x)*midT, my2 = cue.y + (aimEndY-cue.y)*midT;
  drawArrowHead(mx2, my2, nx, ny, 'rgba(255,255,100,0.9)');

  // Custom cursor circle at mouse
  ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 6, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; ctx.stroke();
}

function drawDashedLine(x1,y1,x2,y2,color) {
  ctx.save();
  ctx.setLineDash([9,6]);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.restore();
}

function drawArrowHead(x, y, nx, ny, color) {
  const size = 10;
  const px = -ny, py = nx;
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x + nx*size, y + ny*size);
  ctx.lineTo(x + px*size*0.5, y + py*size*0.5);
  ctx.lineTo(x - px*size*0.5, y - py*size*0.5);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ── Game loop ────────────────────────────────────────────────────────────────

function render() {
  ctx.clearRect(0,0,W,H);
  drawTable();
  for (const b of balls) drawBall(b);
  drawAim();

  if (shooting) {
    for (let s=0; s<SUBSTEPS; s++) stepPhysics(1/SUBSTEPS);
    if (allStopped()) {
      shooting = false;
      const cue = balls[0];
      if (cue.gone) {
        document.getElementById('msg').textContent = '😬 Weißer Ball versenkt! Wird zurückgestellt...';
        setTimeout(() => {
          cue.x = TABLE.left + TW*0.27;
          cue.y = TABLE.top + TH/2;
          cue.vx = 0; cue.vy = 0; cue.gone = false;
          document.getElementById('msg').textContent = '';
        }, 1400);
      }
      document.getElementById('hud').textContent = 'Bewege die Maus zum Zielen — Klick zum Schießen';
    }
  }

  requestAnimationFrame(render);
}

// ── Input ────────────────────────────────────────────────────────────────────

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});

canvas.addEventListener('click', e => {
  if (shooting) return;
  const cue = balls[0];
  if (cue.gone) return;
  const aim = getAimDir();
  if (!aim || aim.len < 5) return;
  const power = parseInt(document.getElementById('power').value);
  cue.vx = aim.nx * power;
  cue.vy = aim.ny * power;
  shooting = true;
  document.getElementById('hud').textContent = '…';
});

document.getElementById('power').addEventListener('input', e => {
  document.getElementById('power-val').textContent = e.target.value;
});

document.getElementById('reset-btn').addEventListener('click', () => {
  makeBalls();
  document.getElementById('msg').textContent = '';
  document.getElementById('hud').textContent = 'Bewege die Maus zum Zielen — Klick zum Schießen';
});

makeBalls();
render();
</script>
</body>
</html>

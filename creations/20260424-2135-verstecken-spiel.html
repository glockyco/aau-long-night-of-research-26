<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Versteckspiel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    user-select: none;
  }
  h1 { font-size: 2rem; margin-bottom: 0.3rem; }
  #info { font-size: 1.1rem; margin-bottom: 1rem; color: #aaa; }
  #timer { font-size: 1.5rem; margin-bottom: 1rem; color: #f0c040; }
  #grid {
    display: grid;
    grid-template-columns: repeat(6, 80px);
    grid-template-rows: repeat(4, 80px);
    gap: 10px;
  }
  .cell {
    width: 80px;
    height: 80px;
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .cell:hover { background: #0f3460; transform: scale(1.05); }
  .cell.revealed { background: #e94560; border-color: #e94560; cursor: default; transform: none; }
  .cell.found { background: #4caf50; border-color: #4caf50; cursor: default; transform: none; }
  #message {
    margin-top: 1.5rem;
    font-size: 1.8rem;
    font-weight: bold;
    color: #4caf50;
    min-height: 2rem;
  }
  #restart {
    margin-top: 1rem;
    padding: 0.6rem 2rem;
    font-size: 1.1rem;
    background: #e94560;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: none;
  }
  #restart:hover { background: #c73652; }
  #countdown {
    font-size: 5rem;
    font-weight: bold;
    color: #f0c040;
    display: none;
  }
</style>
</head>
<body>
<h1>🔍 Versteckspiel</h1>
<div id="info">Finde alle versteckten Emojis!</div>
<div id="timer">Zeit: <span id="seconds">0</span>s</div>
<div id="countdown"></div>
<div id="grid"></div>
<div id="message"></div>
<button id="restart" onclick="startGame()">Nochmal spielen</button>

<script>
  const EMOJIS = ['🐱','🐶','🦊','🐸','🦄','🐼','🐧','🦁','🐯','🐻','🦋','🐙'];
  const GRID_SIZE = 24;
  const HIDDEN_COUNT = 6;

  let hiddenCells = [];
  let foundCount = 0;
  let timerInterval = null;
  let seconds = 0;
  let gameActive = false;

  function startGame() {
    document.getElementById('restart').style.display = 'none';
    document.getElementById('message').textContent = '';
    clearInterval(timerInterval);
    seconds = 0;
    document.getElementById('seconds').textContent = 0;
    foundCount = 0;
    gameActive = false;

    // Pick random emojis to hide
    const shuffled = EMOJIS.sort(() => Math.random() - 0.5);
    const chosen = shuffled.slice(0, HIDDEN_COUNT);

    // Pick random cells
    const allIndices = Array.from({length: GRID_SIZE}, (_, i) => i);
    hiddenCells = [];
    const shuffledIdx = allIndices.sort(() => Math.random() - 0.5);
    for (let i = 0; i < HIDDEN_COUNT; i++) {
      hiddenCells.push({ index: shuffledIdx[i], emoji: chosen[i] });
    }

    buildGrid();
    showCountdown();
  }

  function showCountdown() {
    const grid = document.getElementById('grid');
    const cd = document.getElementById('countdown');
    grid.style.display = 'none';
    cd.style.display = 'block';

    // Show emojis briefly
    document.getElementById('info').textContent = 'Merke dir die Positionen!';
    buildGrid(true);
    grid.style.display = 'grid';

    let count = 3;
    cd.textContent = count;
    const iv = setInterval(() => {
      count--;
      if (count > 0) {
        cd.textContent = count;
      } else {
        clearInterval(iv);
        cd.style.display = 'none';
        grid.style.display = 'grid';
        hideEmojis();
        document.getElementById('info').textContent = 'Klicke auf die Felder wo die Emojis waren!';
        gameActive = true;
        timerInterval = setInterval(() => {
          seconds++;
          document.getElementById('seconds').textContent = seconds;
        }, 1000);
      }
    }, 1000);
  }

  function buildGrid(showHidden = false) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for (let i = 0; i < GRID_SIZE; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.index = i;
      const hidden = hiddenCells.find(h => h.index === i);
      if (hidden && showHidden) {
        cell.textContent = hidden.emoji;
      }
      cell.addEventListener('click', () => onCellClick(i, cell));
      grid.appendChild(cell);
    }
  }

  function hideEmojis() {
    document.querySelectorAll('.cell').forEach(cell => {
      cell.textContent = '';
      cell.className = 'cell';
    });
  }

  function onCellClick(index, cell) {
    if (!gameActive) return;
    if (cell.classList.contains('found') || cell.classList.contains('revealed')) return;

    const hidden = hiddenCells.find(h => h.index === index);
    if (hidden) {
      cell.textContent = hidden.emoji;
      cell.classList.add('found');
      foundCount++;
      if (foundCount === HIDDEN_COUNT) {
        clearInterval(timerInterval);
        gameActive = false;
        document.getElementById('message').textContent = `🎉 Gewonnen in ${seconds} Sekunden!`;
        document.getElementById('restart').style.display = 'inline-block';
      }
    } else {
      cell.classList.add('revealed');
      cell.textContent = '❌';
      setTimeout(() => {
        cell.textContent = '';
        cell.classList.remove('revealed');
      }, 600);
    }
  }

  startGame();
</script>
</body>
</html>

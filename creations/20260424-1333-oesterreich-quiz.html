<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Österreich-Quiz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #c0392b 0%, #c0392b 33%, #ffffff 33%, #ffffff 66%, #c0392b 66%, #c0392b 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .quiz-box {
    background: white;
    border-radius: 20px;
    padding: 40px;
    max-width: 680px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }

  h1 {
    text-align: center;
    font-size: 2em;
    color: #c0392b;
    margin-bottom: 8px;
  }

  .subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
    font-size: 0.95em;
  }

  .progress-bar-container {
    background: #eee;
    border-radius: 10px;
    height: 10px;
    margin-bottom: 30px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #c0392b, #e74c3c);
    border-radius: 10px;
    transition: width 0.4s ease;
  }

  .question-counter {
    text-align: center;
    color: #aaa;
    font-size: 0.85em;
    margin-bottom: 10px;
  }

  .question-text {
    font-size: 1.3em;
    font-weight: 600;
    color: #222;
    text-align: center;
    margin-bottom: 28px;
    line-height: 1.4;
    min-height: 60px;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }

  .option-btn {
    padding: 16px 14px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #fafafa;
    cursor: pointer;
    font-size: 1em;
    color: #333;
    transition: all 0.15s;
    text-align: center;
    line-height: 1.3;
  }

  .option-btn:hover:not(:disabled) {
    border-color: #c0392b;
    background: #fff0f0;
    transform: translateY(-2px);
  }

  .option-btn.correct {
    background: #d4edda;
    border-color: #28a745;
    color: #155724;
  }

  .option-btn.wrong {
    background: #f8d7da;
    border-color: #dc3545;
    color: #721c24;
  }

  .option-btn:disabled { cursor: default; }

  .feedback {
    text-align: center;
    font-size: 1.1em;
    font-weight: 600;
    min-height: 30px;
    margin-bottom: 10px;
    color: #555;
  }

  .feedback.correct { color: #28a745; }
  .feedback.wrong { color: #dc3545; }

  .next-btn {
    display: block;
    width: 100%;
    padding: 15px;
    background: #c0392b;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 1.1em;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 10px;
  }

  .next-btn:hover { background: #a93226; transform: translateY(-1px); }
  .next-btn:active { transform: translateY(0); }
  .next-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

  /* Result screen */
  .result-screen {
    text-align: center;
    display: none;
  }

  .result-emoji {
    font-size: 5em;
    margin-bottom: 16px;
  }

  .result-title {
    font-size: 1.8em;
    font-weight: 700;
    color: #c0392b;
    margin-bottom: 10px;
  }

  .result-score {
    font-size: 3.5em;
    font-weight: 800;
    color: #222;
    margin: 16px 0;
  }

  .result-msg {
    color: #555;
    font-size: 1.05em;
    margin-bottom: 30px;
    line-height: 1.5;
  }

  .restart-btn {
    padding: 15px 40px;
    background: #c0392b;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 1.1em;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  .restart-btn:hover { background: #a93226; }

  @media (max-width: 480px) {
    .options { grid-template-columns: 1fr; }
    .quiz-box { padding: 24px; }
    h1 { font-size: 1.5em; }
  }
</style>
</head>
<body>

<div class="quiz-box">
  <h1>🇦🇹 Österreich-Quiz</h1>
  <p class="subtitle">Wie gut kennst du Österreich?</p>

  <div id="quiz-screen">
    <div class="progress-bar-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="question-counter" id="counter"></div>
    <div class="question-text" id="question-text"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="next-btn" disabled onclick="nextQuestion()">Weiter →</button>
  </div>

  <div class="result-screen" id="result-screen">
    <div class="result-emoji" id="result-emoji"></div>
    <div class="result-title">Quiz beendet!</div>
    <div class="result-score" id="result-score"></div>
    <div class="result-msg" id="result-msg"></div>
    <button class="restart-btn" onclick="startQuiz()">Nochmal spielen 🔄</button>
  </div>
</div>

<script>
const allQuestions = [
  {
    q: "Was ist die Hauptstadt von Österreich?",
    options: ["Salzburg", "Wien", "Graz", "Linz"],
    correct: 1
  },
  {
    q: "Wie viele Bundesländer hat Österreich?",
    options: ["7", "8", "9", "10"],
    correct: 2
  },
  {
    q: "Welcher Fluss fließt durch Wien?",
    options: ["Inn", "Mur", "Salzach", "Donau"],
    correct: 3
  },
  {
    q: "Welches ist der höchste Berg Österreichs?",
    options: ["Dachstein", "Großglockner", "Zugspitze", "Wildspitze"],
    correct: 1
  },
  {
    q: "Wer komponierte die Zauberflöte?",
    options: ["Beethoven", "Schubert", "Mozart", "Haydn"],
    correct: 2
  },
  {
    q: "Welche Farben hat die österreichische Flagge?",
    options: ["Blau-Weiß-Rot", "Rot-Weiß-Rot", "Schwarz-Gelb-Rot", "Grün-Weiß-Rot"],
    correct: 1
  },
  {
    q: "In welchem Bundesland liegt Salzburg?",
    options: ["Tirol", "Steiermark", "Salzburg", "Kärnten"],
    correct: 2
  },
  {
    q: "Was ist der Schilling?",
    options: ["Ein Berg in Tirol", "Die frühere österreichische Währung", "Ein Gericht aus Wien", "Ein Komponist"],
    correct: 1
  },
  {
    q: "Welche Sprache wird in Österreich offiziell gesprochen?",
    options: ["Österreichisch", "Deutsch", "Bairisch", "Alemannisch"],
    correct: 1
  },
  {
    q: "Was ist ein Wiener Schnitzel traditionell?",
    options: ["Schweinefleisch paniert", "Kalbfleisch paniert", "Hühnerfleisch paniert", "Rindfleisch paniert"],
    correct: 1
  },
  {
    q: "Welche Stadt wird als 'Hauptstadt der Steiermark' bezeichnet?",
    options: ["Klagenfurt", "Innsbruck", "Graz", "Linz"],
    correct: 2
  },
  {
    q: "Mit welchem Land grenzt Österreich im Süden an?",
    options: ["Schweiz", "Deutschland", "Slowenien & Italien", "Ungarn"],
    correct: 2
  },
  {
    q: "Wofür ist das Wiener Kaffeehaus bekannt?",
    options: ["Fastfood", "Kultur & Gemütlichkeit", "Sportveranstaltungen", "Disco & Nachtleben"],
    correct: 1
  },
  {
    q: "Was wird im Wiener Prater gefunden?",
    options: ["Ein Riesenrad", "Ein Vulkan", "Ein Leuchtturm", "Ein Korallenriff"],
    correct: 0
  },
  {
    q: "Welche österreichische Süßigkeit ist weltbekannt?",
    options: ["Sacher-Torte", "Black Forest Cake", "Bienenstich", "Apfelstrudel ist nicht bekannt"],
    correct: 0
  },
  {
    q: "Wie heißt das österreichische Parlament?",
    options: ["Bundestag", "Nationalrat", "Reichstag", "Senat"],
    correct: 1
  },
  {
    q: "In welchem Jahr wurde Österreich Mitglied der EU?",
    options: ["1989", "1993", "1995", "2004"],
    correct: 2
  },
  {
    q: "Was ist der Lipizzaner?",
    options: ["Eine österreichische Automarke", "Eine Pferderasse aus der Spanischen Hofreitschule", "Ein Wein aus der Steiermark", "Ein Käse aus Vorarlberg"],
    correct: 1
  },
  {
    q: "Welcher See liegt an der Grenze zwischen Österreich, Deutschland und der Schweiz?",
    options: ["Attersee", "Bodensee", "Wolfgangsee", "Neusiedler See"],
    correct: 1
  },
  {
    q: "Was ist der Neusiedler See bekannt für?",
    options: ["Tiefes kaltes Wasser", "Flacher Steppensee & Vogelparadies", "Unterwasserhöhlen", "Surfen im Atlantik"],
    correct: 1
  }
];

let questions = [];
let current = 0;
let score = 0;
let answered = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  questions = shuffle(allQuestions).slice(0, 10);
  current = 0;
  score = 0;
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = questions[current];
  const total = questions.length;

  document.getElementById('counter').textContent = `Frage ${current + 1} von ${total}`;
  document.getElementById('progress-bar').style.width = `${(current / total) * 100}%`;
  document.getElementById('question-text').textContent = q.q;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('next-btn').disabled = true;
  document.getElementById('next-btn').textContent = current === total - 1 ? 'Ergebnis anzeigen 🏁' : 'Weiter →';

  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i, q.correct);
    optionsDiv.appendChild(btn);
  });
}

function selectAnswer(selected, correct) {
  if (answered) return;
  answered = true;

  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);

  const feedback = document.getElementById('feedback');

  if (selected === correct) {
    btns[selected].classList.add('correct');
    score++;
    feedback.textContent = '✅ Richtig!';
    feedback.className = 'feedback correct';
  } else {
    btns[selected].classList.add('wrong');
    btns[correct].classList.add('correct');
    feedback.textContent = `❌ Falsch! Richtig wäre: „${questions[current].options[correct]}"`;
    feedback.className = 'feedback wrong';
  }

  document.getElementById('next-btn').disabled = false;
}

function nextQuestion() {
  current++;
  if (current >= questions.length) {
    showResult();
  } else {
    showQuestion();
  }
}

function showResult() {
  document.getElementById('quiz-screen').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'block';

  const pct = score / questions.length;
  let emoji, msg;

  if (pct === 1)        { emoji = '🏆'; msg = 'Perfekt! Du bist ein echter Österreich-Experte!'; }
  else if (pct >= 0.8)  { emoji = '🥇'; msg = 'Ausgezeichnet! Du kennst Österreich wirklich gut!'; }
  else if (pct >= 0.6)  { emoji = '🥈'; msg = 'Gut gemacht! Du weißt schon einiges über Österreich.'; }
  else if (pct >= 0.4)  { emoji = '🥉'; msg = 'Nicht schlecht! Mit ein bisschen Übung wirst du noch besser.'; }
  else                  { emoji = '📚'; msg = 'Österreich hat noch viel zu entdecken – versuch es nochmal!'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-score').textContent = `${score} / ${questions.length}`;
  document.getElementById('result-msg').textContent = msg;
  document.getElementById('progress-bar').style.width = '100%';
}

startQuiz();
</script>
</body>
</html>

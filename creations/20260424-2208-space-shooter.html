<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Space Shooter — R-Type Style</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Courier New', monospace; overflow: hidden; }
  canvas { border: 2px solid #1a1aff; box-shadow: 0 0 30px #0033ff, 0 0 60px #001166; image-rendering: pixelated; }
  #ui { color: #00ccff; font-size: 14px; margin-bottom: 8px; display: flex; gap: 40px; text-shadow: 0 0 8px #00ccff; }
  #gameOver, #startScreen { position: absolute; text-align: center; color: #fff; }
  #gameOver h2 { font-size: 48px; color: #ff3333; text-shadow: 0 0 20px #ff0000; margin-bottom: 16px; }
  #startScreen h1 { font-size: 42px; color: #00aaff; text-shadow: 0 0 20px #0066ff; margin-bottom: 12px; }
  #startScreen p, #gameOver p { font-size: 18px; color: #aaa; margin: 6px 0; }
  .highlight { color: #ffcc00; text-shadow: 0 0 8px #ff9900; }
  button { margin-top: 20px; padding: 12px 36px; font-size: 18px; background: #0033aa; color: #fff; border: 2px solid #0066ff; cursor: pointer; font-family: 'Courier New', monospace; text-transform: uppercase; letter-spacing: 2px; }
  button:hover { background: #0055dd; box-shadow: 0 0 16px #0066ff; }
  #powerupInfo { color: #ffcc00; font-size: 13px; margin-top: 6px; text-shadow: 0 0 6px #ff9900; min-height: 18px; }
</style>
</head>
<body>
<div id="ui">
  <span>SCORE: <span id="scoreDisplay" class="highlight">0</span></span>
  <span>LEBEN: <span id="livesDisplay" class="highlight">3</span></span>
  <span>LEVEL: <span id="levelDisplay" class="highlight">1</span></span>
  <span>POWER: <span id="powerDisplay" class="highlight">▸</span></span>
</div>
<div id="powerupInfo" id="puInfo"></div>
<canvas id="c" width="800" height="480"></canvas>

<div id="startScreen">
  <h1>⚡ SPACE FORCE ⚡</h1>
  <p>R-Type Style Shooter</p>
  <p style="margin-top:16px">🎮 <span class="highlight">Pfeiltasten</span> — Bewegen</p>
  <p>🔫 <span class="highlight">Leertaste</span> — Schießen (halten für Charge-Shot!)</p>
  <p>💥 <span class="highlight">Power-Ups sammeln</span> für Upgrades</p>
  <button onclick="startGame()">STARTEN</button>
</div>

<div id="gameOver" style="display:none">
  <h2>GAME OVER</h2>
  <p>Score: <span class="highlight" id="finalScore">0</span></p>
  <button onclick="startGame()">NOCHMAL</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Wall thickness — playfield is between WALL_T and H-WALL_T
const WALL_T = 52;

let state = 'start';
let score = 0, lives = 3, level = 1;
let frameCount = 0;

// Power-up types
const POWERUPS = {
  SPREAD: { color: '#ff6600', label: 'SPREAD', icon: '❖' },
  LASER:  { color: '#ff00ff', label: 'LASER',  icon: '═' },
  SHIELD: { color: '#00ffcc', label: 'SHIELD', icon: '🛡' },
  SPEED:  { color: '#ffff00', label: 'SPEED',  icon: '⚡' },
  DRONE:  { color: '#ff99ff', label: 'DRONE',  icon: '◈' },
};

let player, bullets, enemies, particles, powerups, explosions, bgStars, drones;
let keys = {};
let chargeTime = 0;
let currentPowerup = null;
let shieldActive = false;
let shieldTimer = 0;
let speedBoost = false;
let speedTimer = 0;
let levelTimer = 0;
let puInfoTimer = 0;

document.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.code] = false; });

function initGame() {
  player = { x: 80, y: WALL_T + (H-WALL_T*2)/2, w: 48, h: 24, vx: 0, vy: 0, fireTimer: 0 };
  bullets = []; enemies = []; particles = []; powerups = []; explosions = [];
  drones = [];
  currentPowerup = null; shieldActive = false; shieldTimer = 0;
  speedBoost = false; speedTimer = 0;
  bgStars = Array.from({length:120}, () => ({
    x: Math.random()*W, y: WALL_T + Math.random()*(H-WALL_T*2),
    s: Math.random()*2+0.5, sp: Math.random()*1.5+0.3,
    b: Math.random()
  }));
  score = 0; lives = 3; level = 1; frameCount = 0; chargeTime = 0;
  levelTimer = 0;
  updateHUD();
}

function updateHUD() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('livesDisplay').textContent = lives;
  document.getElementById('levelDisplay').textContent = level;
  let pstr = '▸';
  if (currentPowerup === 'SPREAD') pstr = '❖ SPREAD';
  else if (currentPowerup === 'LASER') pstr = '═ LASER';
  else if (currentPowerup === 'DRONE') pstr = '◈ DRONE';
  if (shieldActive) pstr += ' 🛡';
  if (speedBoost) pstr += ' ⚡';
  document.getElementById('powerDisplay').textContent = pstr;
}

// ---------- SPAWN ----------
function spawnEnemy() {
  const types = ['scout', 'fighter', 'heavy', 'zigzag'];
  let w = Math.random(), type;
  if (w < 0.35) type = 'scout';
  else if (w < 0.65) type = 'fighter';
  else if (w < 0.85) type = 'heavy';
  else type = 'zigzag';

  let hp = type === 'heavy' ? 5 : (type === 'fighter' ? 2 : 1);
  hp += Math.floor(level * 0.5);

  enemies.push({
    x: W + 30, y: WALL_T + Math.random() * (H - WALL_T*2 - 20) + 10,
    w: type === 'heavy' ? 52 : 36, h: type === 'heavy' ? 28 : 20,
    vx: -(1.2 + Math.random()*1.2 + level*0.15),
    vy: 0, hp, maxHp: hp, type,
    fireTimer: Math.random()*120,
    phase: Math.random()*Math.PI*2,
    color: type === 'heavy' ? '#ff4400' : (type === 'fighter' ? '#cc00ff' : '#ff2222')
  });
}

function spawnPowerup(x, y) {
  if (Math.random() > 0.35) return;
  const keys = Object.keys(POWERUPS);
  const type = keys[Math.floor(Math.random()*keys.length)];
  powerups.push({ x, y, type, vy: (Math.random()-0.5)*0.8, vx: -1.2, r: 14, t: 0 });
}

// ---------- DRAW HELPERS ----------
function drawShip(x, y, w, h, color, accent) {
  ctx.save();
  ctx.translate(x, y);
  // Body
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-w/2, 0);
  ctx.lineTo(-w/2+8, -h/2);
  ctx.lineTo(w/2-4, -h/6);
  ctx.lineTo(w/2, 0);
  ctx.lineTo(w/2-4, h/6);
  ctx.lineTo(-w/2+8, h/2);
  ctx.closePath();
  ctx.fill();
  // Cockpit
  ctx.fillStyle = accent;
  ctx.beginPath();
  ctx.ellipse(w/6, 0, w/5, h/4, 0, 0, Math.PI*2);
  ctx.fill();
  // Engine glow
  let grad = ctx.createRadialGradient(-w/2-4, 0, 0, -w/2-4, 0, 12);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.3, '#4488ff');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(-w/2-4, 0, 10 + Math.sin(frameCount*0.3)*3, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.fillStyle = e.color;
  if (e.type === 'heavy') {
    ctx.beginPath();
    ctx.moveTo(e.w/2, 0);
    ctx.lineTo(e.w/4, -e.h/2);
    ctx.lineTo(-e.w/2, -e.h/3);
    ctx.lineTo(-e.w/2+4, 0);
    ctx.lineTo(-e.w/2, e.h/3);
    ctx.lineTo(e.w/4, e.h/2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ff8800';
    ctx.beginPath(); ctx.arc(-e.w/4, 0, 6, 0, Math.PI*2); ctx.fill();
    // HP bar
    ctx.fillStyle = '#333'; ctx.fillRect(-e.w/2, -e.h/2-8, e.w, 4);
    ctx.fillStyle = '#ff4400'; ctx.fillRect(-e.w/2, -e.h/2-8, e.w*(e.hp/e.maxHp), 4);
  } else if (e.type === 'fighter') {
    ctx.beginPath();
    ctx.moveTo(e.w/2, 0);
    ctx.lineTo(-e.w/2, -e.h/2);
    ctx.lineTo(-e.w/4, 0);
    ctx.lineTo(-e.w/2, e.h/2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#dd88ff';
    ctx.beginPath(); ctx.ellipse(0, 0, 6, 4, 0, 0, Math.PI*2); ctx.fill();
  } else if (e.type === 'zigzag') {
    ctx.strokeStyle = e.color; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(e.w/2, 0);
    ctx.lineTo(0, -e.h/2);
    ctx.lineTo(-e.w/2, 0);
    ctx.lineTo(0, e.h/2);
    ctx.closePath();
    ctx.stroke(); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(e.w/2, 0);
    ctx.lineTo(-e.w/2, -e.h/2);
    ctx.lineTo(-e.w/3, 0);
    ctx.lineTo(-e.w/2, e.h/2);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawPowerup(p) {
  const pu = POWERUPS[p.type];
  ctx.save();
  ctx.translate(p.x, p.y);
  // Pulsing circle
  let pulse = 0.8 + 0.2*Math.sin(p.t*0.1);
  ctx.strokeStyle = pu.color;
  ctx.lineWidth = 2;
  ctx.shadowColor = pu.color;
  ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(0, 0, p.r * pulse, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = pu.color + '33';
  ctx.fill();
  ctx.fillStyle = pu.color;
  ctx.font = 'bold 13px Courier New';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(pu.icon, 0, 0);
  ctx.restore();
}

function addParticles(x, y, color, n=12, spd=3) {
  for (let i=0; i<n; i++) {
    let a = Math.random()*Math.PI*2;
    particles.push({ x, y, vx: Math.cos(a)*spd*(0.5+Math.random()), vy: Math.sin(a)*spd*(0.5+Math.random()), life: 30+Math.random()*20, color });
  }
}

function addExplosion(x, y, big=false) {
  explosions.push({ x, y, r: 0, maxR: big ? 60 : 35, t: 0, big });
  addParticles(x, y, big ? '#ff8800' : '#ff4400', big ? 24 : 14, big ? 5 : 3);
}

// ---------- FIRE ----------
function playerFire() {
  let px = player.x + player.w/2;
  let py = player.y;
  let charge = Math.min(chargeTime / 90, 1);
  if (currentPowerup === 'SPREAD') {
    for (let a of [-0.25, -0.12, 0, 0.12, 0.25]) {
      bullets.push({ x: px, y: py, vx: Math.cos(a)*10, vy: Math.sin(a)*10, w: 8, h: 4, color: '#ff9900', player: true, dmg: 1 });
    }
  } else if (currentPowerup === 'LASER') {
    bullets.push({ x: px, y: py, vx: 18, vy: 0, w: 40, h: 6, color: '#ff44ff', player: true, dmg: 2, laser: true });
  } else if (charge > 0.6) {
    let sz = 6 + charge*14;
    bullets.push({ x: px, y: py, vx: 12+charge*4, vy: 0, w: sz*2, h: sz, color: `hsl(${200+charge*60},100%,60%)`, player: true, dmg: Math.ceil(charge*3) });
    addParticles(px, py, '#00aaff', 8, 2);
  } else {
    bullets.push({ x: px, y: py, vx: 12, vy: 0, w: 14, h: 4, color: '#00ccff', player: true, dmg: 1 });
  }
  // Drones also fire
  for (let d of drones) {
    bullets.push({ x: d.x+12, y: d.y, vx: 11, vy: 0, w: 10, h: 3, color: '#ff99ff', player: true, dmg: 1 });
  }
}

function enemyFire(e) {
  let dx = player.x - e.x, dy = player.y - e.y;
  let dist = Math.sqrt(dx*dx+dy*dy) || 1;
  let spd = e.type === 'heavy' ? 5 : 4;
  bullets.push({ x: e.x-e.w/2, y: e.y, vx: dx/dist*spd-1, vy: dy/dist*spd, w: 10, h: 4, color: '#ff4422', player: false, dmg: 1 });
}

// ---------- UPDATE ----------
function update() {
  frameCount++;
  levelTimer++;

  // Level up every 900 frames
  if (levelTimer > 900) { level++; levelTimer = 0; updateHUD(); }

  // Stars
  for (let s of bgStars) { s.x -= s.sp; if (s.x < 0) { s.x = W; s.y = WALL_T + Math.random()*(H-WALL_T*2); } }

  // Player move
  let spd = (speedBoost ? 5.5 : 3.5);
  if (keys['ArrowLeft'] || keys['KeyA'])  player.y = Math.max(player.h/2, player.y - spd - (keys['ShiftLeft']?1.5:0));
  // wait — horizontal scroll game: up/down + slight horiz
  if (keys['ArrowUp']    || keys['KeyW'])  player.y = Math.max(WALL_T + player.h/2+2, player.y - spd);
  if (keys['ArrowDown']  || keys['KeyS'])  player.y = Math.min(H-WALL_T - player.h/2-2, player.y + spd);
  if (keys['ArrowLeft']  || keys['KeyA'])  player.x = Math.max(player.w/2,      player.x - spd*0.6);
  if (keys['ArrowRight'] || keys['KeyD'])  player.x = Math.min(W*0.45,          player.x + spd*0.6);

  // Shooting
  if (keys['Space']) {
    chargeTime++;
    player.fireTimer--;
    if (player.fireTimer <= 0) {
      player.fireTimer = currentPowerup === 'LASER' ? 6 : (currentPowerup === 'SPREAD' ? 12 : 18);
      playerFire();
    }
  } else {
    if (chargeTime > 30) { playerFire(); }
    chargeTime = 0;
    player.fireTimer = 0;
  }

  // Timers
  if (shieldActive) { shieldTimer--; if (shieldTimer <= 0) { shieldActive = false; updateHUD(); } }
  if (speedBoost)   { speedTimer--;  if (speedTimer <= 0)  { speedBoost = false;   updateHUD(); } }

  // Drones orbit player
  drones.forEach((d,i) => {
    let angle = frameCount * 0.04 + i * Math.PI;
    d.x = player.x + Math.cos(angle) * 30;
    d.y = player.y + Math.sin(angle) * 22;
  });

  // Spawn enemies
  let spawnRate = Math.max(40, 80 - level*5);
  if (frameCount % spawnRate === 0) spawnEnemy();

  // Update bullets — destroy on wall hit
  bullets = bullets.filter(b => {
    b.x += b.vx; b.y += b.vy;
    if (b.y - b.h/2 < WALL_T || b.y + b.h/2 > H-WALL_T) {
      addParticles(b.x, b.y, b.color, 4, 1.5);
      return false;
    }
    return b.x > -b.w && b.x < W+b.w;
  });

  // Bullets vs enemies
  for (let b of bullets.filter(b => b.player)) {
    for (let e of enemies) {
      if (Math.abs(b.x - e.x) < (b.w/2 + e.w/2) && Math.abs(b.y - e.y) < (b.h/2 + e.h/2)) {
        e.hp -= b.dmg;
        addParticles(b.x, b.y, e.color, 5, 2);
        if (!b.laser) b.vx = 999; // kill bullet (move offscreen)
        if (e.hp <= 0) {
          addExplosion(e.x, e.y, e.type === 'heavy');
          score += e.type === 'heavy' ? 300 : (e.type === 'fighter' ? 150 : 100);
          score += level * 10;
          spawnPowerup(e.x, e.y);
          e.hp = -99;
          updateHUD();
        }
      }
    }
  }
  enemies = enemies.filter(e => e.hp > -90 && e.x > -60);

  // Enemy movement & fire
  for (let e of enemies) {
    e.x += e.vx;
    if (e.type === 'zigzag') { e.vy = Math.sin(frameCount * 0.05 + e.phase) * 3; }
    else if (e.type === 'fighter') { e.vy = Math.sin(frameCount * 0.03 + e.phase) * 1.5; }
    e.y = Math.max(WALL_T + e.h/2, Math.min(H-WALL_T - e.h/2, e.y + e.vy));
    e.fireTimer--;
    let fireRate = e.type === 'heavy' ? 80 : (e.type === 'fighter' ? 100 : 150);
    fireRate = Math.max(30, fireRate - level*3);
    if (e.fireTimer <= 0) { enemyFire(e); e.fireTimer = fireRate + Math.random()*40; }
  }

  // Enemy bullets vs player
  for (let b of bullets.filter(b => !b.player)) {
    if (Math.abs(b.x - player.x) < 22 && Math.abs(b.y - player.y) < 14) {
      if (shieldActive) {
        addParticles(b.x, b.y, '#00ffcc', 8, 3);
        b.vx = 999;
      } else {
        addExplosion(player.x, player.y, false);
        lives--;
        updateHUD();
        b.vx = 999;
        player.x = 80; player.y = WALL_T + (H-WALL_T*2)/2;
        if (lives <= 0) { gameOver(); return; }
      }
    }
  }

  // Enemies vs player
  for (let e of enemies) {
    if (Math.abs(e.x - player.x) < (e.w/2+18) && Math.abs(e.y - player.y) < (e.h/2+12)) {
      if (shieldActive) { addExplosion(e.x, e.y, false); e.hp = -99; }
      else {
        addExplosion(player.x, player.y, true);
        lives--;
        updateHUD();
        e.hp = -99;
        player.x = 80; player.y = WALL_T + (H-WALL_T*2)/2;
        if (lives <= 0) { gameOver(); return; }
      }
    }
  }

  // Power-ups
  for (let p of powerups) {
    p.x += p.vx; p.y += p.vy; p.t++;
    // bounce off walls
    if (p.y < WALL_T + p.r || p.y > H-WALL_T - p.r) p.vy *= -1;
    // collect
    if (Math.abs(p.x - player.x) < 28 && Math.abs(p.y - player.y) < 28) {
      collectPowerup(p.type);
      addParticles(p.x, p.y, POWERUPS[p.type].color, 14, 3);
      p.x = -100;
    }
  }
  powerups = powerups.filter(p => p.x > -60 && p.t < 600);

  // Particles
  for (let p of particles) { p.x += p.vx; p.y += p.vy; p.life--; p.vx *= 0.97; p.vy *= 0.97; }
  particles = particles.filter(p => p.life > 0);

  // Explosions
  for (let ex of explosions) { ex.r += ex.big ? 4 : 3; ex.t++; }
  explosions = explosions.filter(ex => ex.r < ex.maxR);
}

function collectPowerup(type) {
  if (type === 'SHIELD') { shieldActive = true; shieldTimer = 400; }
  else if (type === 'SPEED') { speedBoost = true; speedTimer = 350; }
  else if (type === 'DRONE') {
    if (drones.length < 2) drones.push({ x: player.x, y: player.y });
  }
  else { currentPowerup = type; }
  // Show info
  let info = { SPREAD:'SPREAD SHOT aktiv!', LASER:'LASER aktiv!', SHIELD:'SCHILD aktiv!', SPEED:'SPEED aktiv!', DRONE:'DROHNE dazugekommen!' };
  document.getElementById('powerupInfo').textContent = '★ ' + info[type];
  setTimeout(() => { document.getElementById('powerupInfo').textContent = ''; }, 2500);
  updateHUD();
}

// ---------- DRAW ----------
function draw() {
  // Background
  ctx.fillStyle = '#02010a';
  ctx.fillRect(0, 0, W, H);

  // Nebula layers
  for (let i=0; i<3; i++) {
    let g = ctx.createRadialGradient(W*0.3+i*200, H*0.5, 0, W*0.3+i*200, H*0.5, 200);
    g.addColorStop(0, `rgba(${i===0?20:0},${i===1?15:0},${i===2?40:30},0.08)`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }

  // Stars
  for (let s of bgStars) {
    ctx.fillStyle = `rgba(255,255,255,${0.3+s.b*0.7})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }

  // Explosions
  for (let ex of explosions) {
    let g = ctx.createRadialGradient(ex.x, ex.y, 0, ex.x, ex.y, ex.r);
    g.addColorStop(0, 'rgba(255,255,200,0.9)');
    g.addColorStop(0.3, 'rgba(255,140,0,0.6)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI*2); ctx.fill();
  }

  // Power-ups
  for (let p of powerups) drawPowerup(p);

  // Enemy bullets
  for (let b of bullets.filter(b => !b.player)) {
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color; ctx.shadowBlur = 8;
    ctx.fillRect(b.x-b.w/2, b.y-b.h/2, b.w, b.h);
    ctx.shadowBlur = 0;
  }

  // Enemies
  ctx.shadowBlur = 10;
  for (let e of enemies) { ctx.shadowColor = e.color; drawEnemy(e); }
  ctx.shadowBlur = 0;

  // Player bullets
  for (let b of bullets.filter(b => b.player)) {
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color; ctx.shadowBlur = b.laser ? 16 : 8;
    ctx.fillRect(b.x-b.w/2, b.y-b.h/2, b.w, b.h);
    ctx.shadowBlur = 0;
  }

  // Drones
  for (let d of drones) {
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.strokeStyle = '#ff99ff'; ctx.lineWidth = 1.5;
    ctx.shadowColor = '#ff99ff'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#ff99ff44'; ctx.fill();
    ctx.restore();
  }

  // Player
  ctx.shadowColor = '#0088ff'; ctx.shadowBlur = 16;
  drawShip(player.x, player.y, player.w, player.h, '#2255cc', '#88ddff');
  ctx.shadowBlur = 0;

  // Shield
  if (shieldActive) {
    ctx.save();
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 2 + Math.sin(frameCount*0.15)*1;
    ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 20;
    ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.arc(player.x, player.y, 30, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 0.1; ctx.fillStyle = '#00ffcc'; ctx.fill();
    ctx.restore();
  }

  // Charge bar
  if (keys['Space'] && chargeTime > 10) {
    let charge = Math.min(chargeTime/90, 1);
    let bw = 60;
    ctx.fillStyle = '#333';
    ctx.fillRect(player.x - bw/2, player.y - 28, bw, 5);
    ctx.fillStyle = `hsl(${200+charge*60},100%,55%)`;
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
    ctx.fillRect(player.x - bw/2, player.y - 28, bw*charge, 5);
    ctx.shadowBlur = 0;
  }

  // Particles
  for (let p of particles) {
    ctx.globalAlpha = p.life/50;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-2, p.y-2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // Walls — drawn last so they cover everything
  drawWalls();
}

function drawWalls() {
  // Clip stars/game to playfield by overdrawing the wall regions
  for (let top of [true, false]) {
    let wy = top ? 0 : H - WALL_T;
    let wy2 = top ? WALL_T : H;

    // Base metal plate
    let grad = ctx.createLinearGradient(0, wy, 0, wy2);
    if (top) {
      grad.addColorStop(0,   '#1a1a2e');
      grad.addColorStop(0.4, '#22304a');
      grad.addColorStop(0.75,'#1c2a3e');
      grad.addColorStop(1,   '#0d1520');
    } else {
      grad.addColorStop(0,   '#0d1520');
      grad.addColorStop(0.25,'#1c2a3e');
      grad.addColorStop(0.6, '#22304a');
      grad.addColorStop(1,   '#1a1a2e');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, wy, W, WALL_T);

    // Horizontal panel lines
    let lineY = top ? [WALL_T*0.35, WALL_T*0.65] : [wy + WALL_T*0.35, wy + WALL_T*0.65];
    ctx.strokeStyle = '#0a1828';
    ctx.lineWidth = 1.5;
    for (let ly of lineY) {
      ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(W, ly); ctx.stroke();
    }

    // Vertical panel segments
    ctx.strokeStyle = '#162234';
    ctx.lineWidth = 1;
    for (let sx = 0; sx < W; sx += 80) {
      ctx.beginPath(); ctx.moveTo(sx, wy); ctx.lineTo(sx, wy2); ctx.stroke();
    }

    // Rivets / bolts
    ctx.fillStyle = '#3a5070';
    let rivetY1 = top ? WALL_T * 0.22 : wy + WALL_T * 0.22;
    let rivetY2 = top ? WALL_T * 0.78 : wy + WALL_T * 0.78;
    for (let rx = 20; rx < W; rx += 80) {
      for (let ry of [rivetY1, rivetY2]) {
        ctx.beginPath(); ctx.arc(rx, ry, 3.5, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#5588aa'; ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    }

    // Coloured warning stripe at the playfield edge
    let edgeY = top ? WALL_T - 6 : wy + 6;
    let stripeH = 6;
    let stripeW = 28;
    for (let sx = 0; sx < W; sx += stripeW*2) {
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(sx, top ? WALL_T-stripeH : wy, stripeW, stripeH);
      ctx.fillStyle = '#111';
      ctx.fillRect(sx+stripeW, top ? WALL_T-stripeH : wy, stripeW, stripeH);
    }

    // Glowing inner edge light
    let glowY = top ? WALL_T : wy;
    let glowGrad = ctx.createLinearGradient(0, glowY - (top?8:-8), 0, glowY + (top?4:-4));
    glowGrad.addColorStop(0, 'transparent');
    glowGrad.addColorStop(top ? 1 : 0, 'rgba(0,180,255,0.18)');
    glowGrad.addColorStop(top ? 0 : 1, 'transparent');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(0, glowY - (top?8:0), W, 12);

    // Hard edge line
    ctx.strokeStyle = '#004488';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#0088ff';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(0, top ? WALL_T : wy);
    ctx.lineTo(W, top ? WALL_T : wy);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Occasional blinking status lights
    for (let lx = 60; lx < W; lx += 160) {
      let phase = (frameCount + lx) * 0.03;
      let on = Math.sin(phase) > 0.4;
      ctx.fillStyle = on ? (lx % 320 < 160 ? '#00ff88' : '#ff4400') : '#112233';
      ctx.shadowColor = on ? (lx % 320 < 160 ? '#00ff88' : '#ff4400') : 'transparent';
      ctx.shadowBlur = on ? 10 : 0;
      let ly = top ? WALL_T * 0.5 : wy + WALL_T * 0.5;
      ctx.beginPath(); ctx.arc(lx, ly, 4, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
}

// ---------- LOOP ----------
function gameLoop() {
  if (state !== 'playing') return;
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOver').style.display = 'none';
  state = 'playing';
  initGame();
  gameLoop();
}

function gameOver() {
  state = 'over';
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOver').style.display = 'block';
}

// Initial star draw on canvas while on start screen
(function drawStartBg() {
  bgStars = Array.from({length:120}, () => ({
    x: Math.random()*W, y: Math.random()*H, s: Math.random()*2+0.5, sp: 0, b: Math.random()
  }));
  ctx.fillStyle = '#02010a'; ctx.fillRect(0,0,W,H);
  for (let s of bgStars) {
    ctx.fillStyle = `rgba(255,255,255,${0.3+s.b*0.7})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
})();
</script>

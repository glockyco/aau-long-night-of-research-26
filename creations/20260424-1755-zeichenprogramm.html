<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeichenprogramm</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    gap: 10px;
    padding: 10px;
  }

  h1 { color: #e94560; font-size: 1.6rem; letter-spacing: 2px; flex-shrink: 0; }

  #toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    background: #0f0f1a;
    border-radius: 16px;
    padding: 10px 16px;
    width: 100%;
    max-width: 900px;
    flex-shrink: 0;
  }

  .tool-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sep {
    width: 1px; height: 32px;
    background: #333;
  }

  .tool-btn {
    width: 40px; height: 40px;
    border-radius: 10px;
    border: 2px solid transparent;
    background: #1a1a2e;
    color: #eee;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .tool-btn:hover { background: #2a2a4e; }
  .tool-btn.active { border-color: #e94560; background: #2a1a2e; }

  #color-picker {
    width: 40px; height: 40px;
    border-radius: 10px;
    border: 2px solid #333;
    padding: 0;
    cursor: pointer;
    background: none;
  }

  .palette {
    display: flex; gap: 5px; flex-wrap: wrap;
  }
  .swatch {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.1s, border-color 0.1s;
  }
  .swatch:hover { transform: scale(1.2); }
  .swatch.active { border-color: #fff; }

  label { color: #aaa; font-size: 0.85rem; }

  input[type=range] {
    width: 80px;
    accent-color: #e94560;
  }
  #size-display { color: #f0c040; font-size: 0.9rem; min-width: 28px; }

  #canvas-wrap {
    flex: 1;
    width: 100%;
    max-width: 900px;
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    background: white;
  }
  canvas.eraser-mode { cursor: cell; }
</style>
</head>
<body>

<h1>🎨 Zeichenprogramm</h1>

<div id="toolbar">
  <div class="tool-group">
    <button class="tool-btn active" id="tool-pen"    title="Stift">✏️</button>
    <button class="tool-btn"        id="tool-line"   title="Linie">📏</button>
    <button class="tool-btn"        id="tool-rect"   title="Rechteck">⬜</button>
    <button class="tool-btn"        id="tool-circle" title="Kreis">⭕</button>
    <button class="tool-btn"        id="tool-fill"   title="Füllen">🪣</button>
    <button class="tool-btn"        id="tool-eraser" title="Radierer">🧹</button>
  </div>
  <div class="sep"></div>
  <div class="tool-group">
    <label>Größe</label>
    <input type="range" id="size" min="1" max="60" value="6">
    <span id="size-display">6</span>
  </div>
  <div class="sep"></div>
  <div class="tool-group palette" id="palette"></div>
  <input type="color" id="color-picker" value="#e94560" title="Eigene Farbe">
  <div class="sep"></div>
  <div class="tool-group">
    <button class="tool-btn" id="btn-undo"  title="Rückgängig">↩️</button>
    <button class="tool-btn" id="btn-clear" title="Alles löschen">🗑️</button>
    <button class="tool-btn" id="btn-save"  title="Speichern">💾</button>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');

// Resize canvas to fill wrap
function resize() {
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  // save image
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  canvas.width = w;
  canvas.height = h;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);
  ctx.putImageData(img, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// State
let tool = 'pen';
let color = '#e94560';
let size = 6;
let drawing = false;
let startX, startY;
let snapshot;
let history = [];

// Palette
const COLORS = ['#000000','#ffffff','#e94560','#e67e22','#f0c040','#27ae60','#2980b9','#8e44ad','#1abc9c','#95a5a6','#7f8c8d','#2c3e50'];
const palette = document.getElementById('palette');
let activeSwatchEl = null;

COLORS.forEach(c => {
  const s = document.createElement('div');
  s.className = 'swatch';
  s.style.background = c;
  s.addEventListener('click', () => {
    color = c;
    document.getElementById('color-picker').value = c;
    if (activeSwatchEl) activeSwatchEl.classList.remove('active');
    s.classList.add('active');
    activeSwatchEl = s;
  });
  palette.appendChild(s);
  if (c === '#e94560') { s.classList.add('active'); activeSwatchEl = s; }
});

document.getElementById('color-picker').addEventListener('input', e => {
  color = e.target.value;
  if (activeSwatchEl) activeSwatchEl.classList.remove('active');
  activeSwatchEl = null;
});

// Size
const sizeInput = document.getElementById('size');
const sizeDisplay = document.getElementById('size-display');
sizeInput.addEventListener('input', () => {
  size = parseInt(sizeInput.value);
  sizeDisplay.textContent = size;
});

// Tools
const toolBtns = { pen: 'tool-pen', line: 'tool-line', rect: 'tool-rect', circle: 'tool-circle', fill: 'tool-fill', eraser: 'tool-eraser' };
Object.entries(toolBtns).forEach(([t, id]) => {
  document.getElementById(id).addEventListener('click', () => {
    tool = t;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    canvas.className = t === 'eraser' ? 'eraser-mode' : '';
  });
});

// History
function saveHistory() {
  history.push(canvas.toDataURL());
  if (history.length > 30) history.shift();
}
saveHistory();

document.getElementById('btn-undo').addEventListener('click', () => {
  if (history.length <= 1) return;
  history.pop();
  const img = new Image();
  img.src = history[history.length - 1];
  img.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img, 0, 0); };
});

document.getElementById('btn-clear').addEventListener('click', () => {
  saveHistory();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  saveHistory();
});

document.getElementById('btn-save').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = 'zeichnung.png';
  a.href = canvas.toDataURL();
  a.click();
});

// Drawing helpers
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width;
  const scaleY = canvas.height / r.height;
  const src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - r.left) * scaleX,
    y: (src.clientY - r.top)  * scaleY
  };
}

function floodFill(x, y, fillColor) {
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;
  const i = (Math.round(y) * canvas.width + Math.round(x)) * 4;
  const tr = data[i], tg = data[i+1], tb = data[i+2], ta = data[i+3];
  const fc = hexToRgb(fillColor);
  if (tr===fc.r && tg===fc.g && tb===fc.b) return;
  const stack = [[Math.round(x), Math.round(y)]];
  while (stack.length) {
    const [cx, cy] = stack.pop();
    const ci = (cy * canvas.width + cx) * 4;
    if (cx<0||cy<0||cx>=canvas.width||cy>=canvas.height) continue;
    if (data[ci]!==tr||data[ci+1]!==tg||data[ci+2]!==tb||data[ci+3]!==ta) continue;
    data[ci]=fc.r; data[ci+1]=fc.g; data[ci+2]=fc.b; data[ci+3]=255;
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
  ctx.putImageData(imgData, 0, 0);
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

function drawShape(x, y) {
  ctx.putImageData(snapshot, 0, 0);
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = size;
  ctx.lineCap = 'round';
  if (tool === 'line') {
    ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(x, y); ctx.stroke();
  } else if (tool === 'rect') {
    ctx.strokeRect(startX, startY, x - startX, y - startY);
  } else if (tool === 'circle') {
    const rx = Math.abs(x - startX) / 2, ry = Math.abs(y - startY) / 2;
    const cx = startX + (x - startX) / 2, cy = startY + (y - startY) / 2;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 2*Math.PI); ctx.stroke();
  }
}

function onDown(e) {
  e.preventDefault();
  const {x, y} = getPos(e);
  if (tool === 'fill') {
    saveHistory();
    floodFill(x, y, color);
    saveHistory();
    return;
  }
  drawing = true;
  startX = x; startY = y;
  snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : color;
  ctx.fillStyle   = tool === 'eraser' ? '#ffffff' : color;
  ctx.lineWidth = size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (tool === 'pen' || tool === 'eraser') {
    ctx.beginPath();
    ctx.moveTo(x, y);
  }
}

function onMove(e) {
  if (!drawing) return;
  e.preventDefault();
  const {x, y} = getPos(e);
  if (tool === 'pen' || tool === 'eraser') {
    ctx.lineTo(x, y);
    ctx.stroke();
  } else {
    drawShape(x, y);
  }
}

function onUp(e) {
  if (!drawing) return;
  drawing = false;
  saveHistory();
}

canvas.addEventListener('mousedown',  onDown);
canvas.addEventListener('mousemove',  onMove);
canvas.addEventListener('mouseup',    onUp);
canvas.addEventListener('mouseleave', onUp);
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchmove',  onMove, { passive: false });
canvas.addEventListener('touchend',   onUp);
</script>
</body>
</html>

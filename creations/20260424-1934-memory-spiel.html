<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Spiel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    min-height: 100vh;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  h1 {
    font-size: 2.2rem;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(100,200,255,0.5);
    letter-spacing: 2px;
  }

  #setup {
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 30px 40px;
    text-align: center;
    max-width: 600px;
    width: 100%;
    margin-top: 20px;
  }

  #setup h2 { margin-bottom: 20px; font-size: 1.3rem; color: #aad4ff; }

  .theme-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 25px;
  }

  .theme-btn {
    background: rgba(255,255,255,0.1);
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 14px 10px;
    cursor: pointer;
    color: white;
    font-size: 1.5rem;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .theme-btn span.label { font-size: 0.75rem; opacity: 0.8; }

  .theme-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
  .theme-btn.selected { border-color: #64c8ff; background: rgba(100,200,255,0.2); }

  #difficulty {
    margin-bottom: 20px;
  }

  #difficulty label { font-size: 0.9rem; color: #aad4ff; margin-right: 10px; }

  #difficulty select {
    background: #1a3a6b;
    border: 2px solid #64c8ff;
    border-radius: 8px;
    color: white;
    padding: 8px 14px;
    font-size: 1rem;
    cursor: pointer;
  }

  #difficulty select option {
    background: #1a3a6b;
    color: white;
  }

  #start-btn {
    background: linear-gradient(135deg, #64c8ff, #0078d4);
    border: none;
    border-radius: 14px;
    padding: 14px 50px;
    font-size: 1.1rem;
    color: white;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(100,200,255,0.3);
  }

  #start-btn:hover { transform: scale(1.05); box-shadow: 0 6px 28px rgba(100,200,255,0.5); }
  #start-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  #game-area { display: none; width: 100%; max-width: 700px; margin-top: 10px; }

  #stats {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-bottom: 18px;
    font-size: 1rem;
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 12px 20px;
  }

  .stat { text-align: center; }
  .stat-val { font-size: 1.6rem; font-weight: bold; color: #64c8ff; }
  .stat-lbl { font-size: 0.7rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }

  #board {
    display: grid;
    gap: 10px;
    justify-content: center;
  }

  .card {
    width: 90px;
    height: 90px;
    perspective: 600px;
    cursor: pointer;
  }

  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(.4,2,.6,1);
    border-radius: 14px;
  }

  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card.matched .card-inner { transform: rotateY(180deg); }

  .card-front, .card-back {
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 14px;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
    user-select: none;
  }

  .card-front {
    background: linear-gradient(135deg, #1e3a5f, #2a5298);
    border: 2px solid rgba(100,200,255,0.3);
    font-size: 1.8rem;
    color: rgba(100,200,255,0.4);
  }

  .card-back {
    background: linear-gradient(135deg, #2a5298, #1e3a5f);
    border: 2px solid rgba(100,200,255,0.6);
    transform: rotateY(180deg);
  }

  .card.matched .card-back {
    background: linear-gradient(135deg, #1a6b3c, #27ae60);
    border-color: #2ecc71;
    animation: pulse 0.4s ease;
  }

  @keyframes pulse {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.15); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  #back-btn {
    margin-top: 18px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 10px 28px;
    color: white;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }

  #back-btn:hover { background: rgba(255,255,255,0.2); }

  #win-banner {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  #win-banner.show { display: flex; }

  .win-box {
    background: linear-gradient(135deg, #1a6b3c, #0f3460);
    border: 2px solid #2ecc71;
    border-radius: 24px;
    padding: 40px 60px;
    text-align: center;
    animation: popIn 0.4s cubic-bezier(.4,2,.6,1);
  }

  @keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .win-box h2 { font-size: 2.5rem; margin-bottom: 10px; }
  .win-box p { font-size: 1.1rem; opacity: 0.85; margin-bottom: 20px; }

  .win-box button {
    background: linear-gradient(135deg, #2ecc71, #27ae60);
    border: none;
    border-radius: 12px;
    padding: 12px 36px;
    color: white;
    font-size: 1rem;
    cursor: pointer;
    font-weight: bold;
    margin: 6px;
    transition: all 0.2s;
  }

  .win-box button:hover { transform: scale(1.05); }
</style>
</head>
<body>

<h1>🃏 Memory</h1>

<div id="setup">
  <h2>Wähle ein Thema:</h2>
  <div class="theme-grid">
    <button class="theme-btn selected" data-theme="tiere" onclick="selectTheme(this)">
      🐶🐱🦊<span class="label">Tiere</span>
    </button>
    <button class="theme-btn" data-theme="essen" onclick="selectTheme(this)">
      🍕🍎🍩<span class="label">Essen</span>
    </button>
    <button class="theme-btn" data-theme="sport" onclick="selectTheme(this)">
      ⚽🎾🏀<span class="label">Sport</span>
    </button>
    <button class="theme-btn" data-theme="natur" onclick="selectTheme(this)">
      🌸🌊🌋<span class="label">Natur</span>
    </button>
    <button class="theme-btn" data-theme="technik" onclick="selectTheme(this)">
      🚀💻🤖<span class="label">Technik</span>
    </button>
    <button class="theme-btn" data-theme="gesichter" onclick="selectTheme(this)">
      😀😎🥳<span class="label">Gesichter</span>
    </button>
  </div>

  <div id="difficulty">
    <label>Schwierigkeit:</label>
    <select id="diff-select">
      <option value="8">Leicht (8 Paare)</option>
      <option value="12" selected>Mittel (12 Paare)</option>
      <option value="18">Schwer (18 Paare)</option>
    </select>
  </div>

  <button id="start-btn" onclick="startGame()">Spiel starten ▶</button>
</div>

<div id="game-area">
  <div id="stats">
    <div class="stat"><div class="stat-val" id="moves-val">0</div><div class="stat-lbl">Züge</div></div>
    <div class="stat"><div class="stat-val" id="pairs-val">0</div><div class="stat-lbl">Paare</div></div>
    <div class="stat"><div class="stat-val" id="time-val">0:00</div><div class="stat-lbl">Zeit</div></div>
    <div class="stat"><div class="stat-val" id="best-moves-val">—</div><div class="stat-lbl">Beste Züge</div></div>
    <div class="stat"><div class="stat-val" id="best-time-val">—</div><div class="stat-lbl">Beste Zeit</div></div>
  </div>
  <div id="board"></div>
  <button id="back-btn" onclick="showSetup()">← Thema wechseln</button>
</div>

<div id="win-banner">
  <div class="win-box">
    <h2>🎉 Gewonnen!</h2>
    <p id="win-msg"></p>
    <button onclick="startGame()">Nochmal spielen</button>
    <button onclick="showSetup()">Thema wechseln</button>
  </div>
</div>

<script>
const themes = {
  tiere:     ['🐶','🐱','🦊','🐻','🦁','🐯','🐸','🐼','🦄','🐙','🦋','🐧','🦅','🐳','🦒','🐘','🦓','🦔'],
  essen:     ['🍕','🍎','🍩','🍣','🍔','🌮','🍜','🍇','🍓','🥑','🍦','🥐','🍋','🥦','🍩','🧁','🍫','🍉'],
  sport:     ['⚽','🎾','🏀','🏈','🎱','🏓','🥊','🏊','🚴','🤸','🏋️','🎿','🧗','🏌️','🥋','🎯','🏹','🤺'],
  natur:     ['🌸','🌊','🌋','⛰️','🌈','🌞','🌙','⭐','❄️','🌿','🍁','🌺','🌴','🔥','💧','🌪️','🌍','🦋'],
  technik:   ['🚀','💻','🤖','📱','⚡','🔬','🛸','🎮','🖨️','📡','🔭','💡','🧲','⚙️','🔋','📷','🎧','🖥️'],
  gesichter: ['😀','😎','🥳','🤩','😍','🤔','😴','🥸','😂','🤯','😱','🥺','😡','🤗','🤫','😏','🥶','🤠'],
};

let selectedTheme = 'tiere';
let flipped = [];
let matched = 0;
let moves = 0;
let totalPairs = 12;
let locked = false;
let timer = null;
let seconds = 0;

function hsKey() { return `hs_${totalPairs}`; }

function loadBest() {
  const hs = JSON.parse(localStorage.getItem(hsKey()) || 'null');
  if (hs) {
    const m = Math.floor(hs.seconds/60), s = hs.seconds%60;
    document.getElementById('best-moves-val').textContent = hs.moves;
    document.getElementById('best-time-val').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  } else {
    document.getElementById('best-moves-val').textContent = '—';
    document.getElementById('best-time-val').textContent = '—';
  }
}

function saveBest() {
  const hs = JSON.parse(localStorage.getItem(hsKey()) || 'null');
  const newRecord = !hs || moves < hs.moves || (moves === hs.moves && seconds < hs.seconds);
  if (newRecord) {
    localStorage.setItem(hsKey(), JSON.stringify({ moves, seconds }));
    return true;
  }
  return false;
}

function selectTheme(btn) {
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedTheme = btn.dataset.theme;
}

function showSetup() {
  document.getElementById('setup').style.display = '';
  document.getElementById('game-area').style.display = 'none';
  document.getElementById('win-banner').classList.remove('show');
  clearInterval(timer);
}

function startGame() {
  totalPairs = parseInt(document.getElementById('diff-select').value);
  document.getElementById('setup').style.display = 'none';
  document.getElementById('game-area').style.display = 'block';
  document.getElementById('win-banner').classList.remove('show');
  buildBoard();
}

function buildBoard() {
  flipped = []; matched = 0; moves = 0; locked = false; seconds = 0;
  clearInterval(timer);
  updateStats();
  loadBest();
  timer = setInterval(() => { seconds++; updateTime(); }, 1000);

  const pool = themes[selectedTheme].slice(0, totalPairs);
  const cards = shuffle([...pool, ...pool]);

  const cols = totalPairs <= 8 ? 4 : totalPairs <= 12 ? 6 : 6;
  const board = document.getElementById('board');
  board.style.gridTemplateColumns = `repeat(${cols}, 90px)`;
  board.innerHTML = '';

  cards.forEach((emoji, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.emoji = emoji;
    card.dataset.index = i;
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-front">?</div>
        <div class="card-back">${emoji}</div>
      </div>`;
    card.addEventListener('click', () => flipCard(card));
    board.appendChild(card);
  });
}

function flipCard(card) {
  if (locked || card.classList.contains('matched')) return;
  if (cheating) {
    cheating = false;
    document.querySelectorAll('.card:not(.matched)').forEach(c => c.classList.remove('flipped'));
    flipped = [];
  }
  if (card.classList.contains('flipped')) return;
  card.classList.add('flipped');
  flipped.push(card);
  if (flipped.length === 2) checkMatch();
}

function checkMatch() {
  locked = true;
  moves++;
  updateStats();
  const [a, b] = flipped;
  if (a.dataset.emoji === b.dataset.emoji) {
    a.classList.add('matched'); b.classList.add('matched');
    matched++;
    updateStats();
    flipped = [];
    locked = false;
    if (matched === totalPairs) showWin();
  } else {
    setTimeout(() => {
      a.classList.remove('flipped');
      b.classList.remove('flipped');
      flipped = [];
      locked = false;
    }, 900);
  }
}

function showWin() {
  clearInterval(timer);
  const isNew = saveBest();
  loadBest();
  const m = Math.floor(seconds/60), s = seconds%60;
  const record = isNew ? ' 🏆 Neuer Rekord!' : '';
  document.getElementById('win-msg').textContent =
    `${moves} Züge · ${m}:${s.toString().padStart(2,'0')} Minuten${record}`;
  document.getElementById('win-banner').classList.add('show');
}

function updateStats() {
  document.getElementById('moves-val').textContent = moves;
  document.getElementById('pairs-val').textContent = `${matched}/${totalPairs}`;
}

function updateTime() {
  const m = Math.floor(seconds/60), s = seconds%60;
  document.getElementById('time-val').textContent = `${m}:${s.toString().padStart(2,'0')}`;
}

let cheating = false;

document.addEventListener('keydown', e => {
  if (e.shiftKey && e.key === 'S' && document.getElementById('game-area').style.display === 'block' && !cheating) {
    cheating = true;
    const unmatched = document.querySelectorAll('.card:not(.matched):not(.flipped)');
    unmatched.forEach(c => c.classList.add('flipped'));
    setTimeout(() => {
      unmatched.forEach(c => c.classList.remove('flipped'));
      cheating = false;
    }, 1500);
  }
});

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
</script>
</body>
</html>

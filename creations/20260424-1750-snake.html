<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #eee;
  }
  h1 { font-size: 2.5rem; margin-bottom: 10px; color: #4ade80; letter-spacing: 4px; }
  #score-board {
    font-size: 1.2rem;
    margin-bottom: 15px;
    display: flex;
    gap: 40px;
  }
  #score-board span { color: #facc15; font-weight: bold; }
  canvas {
    border: 3px solid #4ade80;
    border-radius: 6px;
    box-shadow: 0 0 30px #4ade8066;
  }
  #message {
    margin-top: 20px;
    font-size: 1.1rem;
    color: #94a3b8;
    text-align: center;
  }
  #message b { color: #4ade80; }
  #restart-btn {
    display: none;
    margin-top: 15px;
    padding: 12px 32px;
    font-size: 1.2rem;
    background: #4ade80;
    color: #1a1a2e;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }
  #restart-btn:hover { background: #22c55e; }
</style>
</head>
<body>
<h1>🐍 SNAKE</h1>
<div id="score-board">
  Punkte: <span id="score">0</span> &nbsp;|&nbsp; Rekord: <span id="highscore">0</span>
</div>
<canvas id="canvas" width="400" height="400"></canvas>
<div id="message"><b>Pfeiltasten</b> zum Steuern &nbsp;|&nbsp; <b>Leertaste</b> zum Starten</div>
<button id="restart-btn" onclick="startGame()">Nochmal spielen</button>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CELL = 20;
const COLS = canvas.width / CELL;
const ROWS = canvas.height / CELL;

let snake, dir, nextDir, food, score, highscore = 0, gameLoop, running = false, started = false;

function init() {
  snake = [
    {x: 10, y: 10},
    {x: 9, y: 10},
    {x: 8, y: 10}
  ];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  document.getElementById('score').textContent = 0;
  placeFood();
  draw();
}

function placeFood() {
  let pos;
  do {
    pos = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function startGame() {
  if (gameLoop) clearInterval(gameLoop);
  document.getElementById('restart-btn').style.display = 'none';
  document.getElementById('message').innerHTML = '<b>Pfeiltasten</b> zum Steuern';
  running = true;
  started = true;
  init();
  gameLoop = setInterval(update, 120);
}

function update() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    gameOver(); return;
  }
  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver(); return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById('score').textContent = score;
    if (score > highscore) {
      highscore = score;
      document.getElementById('highscore').textContent = highscore;
    }
    placeFood();
    // Speed up slightly
    if (score % 5 === 0) {
      clearInterval(gameLoop);
      let speed = Math.max(60, 120 - score * 3);
      gameLoop = setInterval(update, speed);
    }
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  // Background
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid (subtle)
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
  }

  // Food
  ctx.fillStyle = '#f87171';
  ctx.shadowColor = '#f87171';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, CELL/2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Snake
  snake.forEach((seg, i) => {
    const ratio = i / snake.length;
    const r = Math.round(74 + ratio * 30);
    const g = Math.round(222 - ratio * 80);
    const b = Math.round(128 - ratio * 60);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.shadowColor = i === 0 ? '#4ade80' : 'transparent';
    ctx.shadowBlur = i === 0 ? 10 : 0;
    roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 4);
  });
  ctx.shadowBlur = 0;

  // Eyes on head
  const hx = snake[0].x * CELL;
  const hy = snake[0].y * CELL;
  ctx.fillStyle = '#1a1a2e';
  const ex = dir.x === 0 ? [4, CELL - 6] : (dir.x > 0 ? [CELL - 6, CELL - 6] : [4, 4]);
  const ey = dir.y === 0 ? [4, 4] : (dir.y > 0 ? [CELL - 6, CELL - 6] : [4, 4]);
  if (dir.x !== 0) {
    ctx.fillRect(hx + ex[0], hy + 4, 3, 3);
    ctx.fillRect(hx + ex[1], hy + CELL - 7, 3, 3);
  } else {
    ctx.fillRect(hx + 4, hy + ey[0], 3, 3);
    ctx.fillRect(hx + CELL - 7, hy + ey[1], 3, 3);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fill();
}

function gameOver() {
  clearInterval(gameLoop);
  running = false;
  // Overlay
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#f87171';
  ctx.font = 'bold 36px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('Game Over!', canvas.width/2, canvas.height/2 - 20);
  ctx.fillStyle = '#facc15';
  ctx.font = '22px Arial';
  ctx.fillText('Punkte: ' + score, canvas.width/2, canvas.height/2 + 20);
  document.getElementById('restart-btn').style.display = 'inline-block';
}

document.addEventListener('keydown', e => {
  if (!started && e.code === 'Space') { startGame(); return; }
  if (e.code === 'Space' && !running && started) { startGame(); return; }
  switch(e.key) {
    case 'ArrowUp':    if (dir.y === 0) nextDir = {x:0, y:-1}; e.preventDefault(); break;
    case 'ArrowDown':  if (dir.y === 0) nextDir = {x:0, y:1};  e.preventDefault(); break;
    case 'ArrowLeft':  if (dir.x === 0) nextDir = {x:-1, y:0}; e.preventDefault(); break;
    case 'ArrowRight': if (dir.x === 0) nextDir = {x:1, y:0};  e.preventDefault(); break;
  }
});

// Touch support
let touchStart = null;
canvas.addEventListener('touchstart', e => { touchStart = e.touches[0]; e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.clientX;
  const dy = e.changedTouches[0].clientY - touchStart.clientY;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && dir.x === 0) nextDir = {x:1, y:0};
    else if (dx < 0 && dir.x === 0) nextDir = {x:-1, y:0};
  } else {
    if (dy > 0 && dir.y === 0) nextDir = {x:0, y:1};
    else if (dy < 0 && dir.y === 0) nextDir = {x:0, y:-1};
  }
  if (!started || !running) startGame();
  touchStart = null;
  e.preventDefault();
}, {passive:false});

init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Weihnachtsbaum Zeichenprogramm</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; font-family: Arial, sans-serif; }
  h1 { color: #ffd700; margin: 10px 0 5px; font-size: 1.4em; text-shadow: 0 0 10px #ffd700; }
  #toolbar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
    background: rgba(255,255,255,0.08); padding: 8px 15px; border-radius: 12px; margin-bottom: 8px;
  }
  .tool-group { display: flex; align-items: center; gap: 6px; }
  label { color: #ccc; font-size: 0.85em; }
  input[type=color] { width: 36px; height: 30px; border: none; border-radius: 6px; cursor: pointer; padding: 2px; background: none; }
  input[type=range] { width: 80px; cursor: pointer; accent-color: #ffd700; }
  button {
    background: #2d6a4f; color: white; border: none; padding: 6px 14px;
    border-radius: 8px; cursor: pointer; font-size: 0.85em; transition: background 0.2s;
  }
  button:hover { background: #40916c; }
  button.active { background: #ffd700; color: #1a1a2e; font-weight: bold; }
  #btnClear { background: #c1121f; }
  #btnClear:hover { background: #e63946; }
  #btnSnow { background: #457b9d; }
  #btnSnow:hover { background: #1d3557; }
  #btnSave { background: #6a0572; }
  #btnSave:hover { background: #9d0191; }
  canvas {
    border-radius: 12px;
    cursor: crosshair;
    box-shadow: 0 0 30px rgba(255,215,0,0.15);
  }
  #sizeVal { color: #ffd700; font-size: 0.85em; min-width: 20px; }
  #stampbar {
    display: flex; gap: 7px; align-items: center; flex-wrap: wrap; justify-content: center;
    background: rgba(255,255,255,0.06); padding: 7px 14px; border-radius: 12px; margin-bottom: 8px;
  }
  .stamp-btn {
    background: #3a3a6a; color: white; border: 2px solid transparent; padding: 5px 10px;
    border-radius: 8px; cursor: pointer; font-size: 0.82em; transition: background 0.2s;
  }
  .stamp-btn:hover { background: #5a5aaa; }
  .stamp-btn.active { border-color: #ffd700; background: #4a4a9a; }
</style>
</head>
<body>
<h1>🎄 Weihnachtsbaum Zeichenprogramm</h1>
<div id="toolbar">
  <div class="tool-group">
    <label>Farbe:</label>
    <input type="color" id="colorPicker" value="#00cc44">
  </div>
  <div class="tool-group">
    <label>Größe:</label>
    <input type="range" id="brushSize" min="1" max="40" value="8">
    <span id="sizeVal">8</span>
  </div>
  <div class="tool-group">
    <button id="btnDraw" class="active" onclick="setTool('draw')">✏️ Malen</button>
    <button id="btnErase" onclick="setTool('erase')">🧹 Radierer</button>
    <button id="btnFill" onclick="setTool('fill')">🪣 Füllen</button>
  </div>
  <div class="tool-group">
    <button id="btnTree" onclick="drawTree()">🎄 Baum</button>
    <button id="btnSnow" onclick="addSnow()">❄️ Schnee</button>
    <button id="btnClear" onclick="clearCanvas()">🗑️ Löschen</button>
    <button id="btnSave" onclick="saveImage()">💾 Speichern</button>
  </div>
</div>
<div id="stampbar">
  <span style="color:#ccc;font-size:0.85em;">Stempel:</span>
  <button class="stamp-btn" onclick="setStamp('star')">⭐ Stern</button>
  <button class="stamp-btn" onclick="setStamp('snowflake')">❄️ Schneeflocke</button>
  <button class="stamp-btn" onclick="setStamp('bell')">🔔 Glocke</button>
  <button class="stamp-btn" onclick="setStamp('candle')">🕯️ Kerze</button>
  <button class="stamp-btn" onclick="setStamp('heart')">❤️ Herz</button>
  <button class="stamp-btn" onclick="setStamp('gift1')">🎁 Geschenk 1</button>
  <button class="stamp-btn" onclick="setStamp('gift2')">🎀 Geschenk 2</button>
  <button class="stamp-btn" onclick="setStamp('gift3')">📦 Geschenk 3</button>
  <label style="color:#ccc;font-size:0.85em;margin-left:8px;">Größe:
    <input type="range" id="stampSize" min="20" max="120" value="50" style="width:70px;accent-color:#ffd700;">
  </label>
</div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  const toolbar = document.querySelector('#toolbar');
  const h1 = document.querySelector('h1');
  const used = h1.offsetHeight + toolbar.offsetHeight + 40;
  canvas.width = Math.min(window.innerWidth - 20, 900);
  canvas.height = window.innerHeight - used;
  drawTree();
}

let tool = 'draw';
let painting = false;
let lastX, lastY;

function setTool(t) {
  tool = t;
  document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('active');
}

const colorPicker = document.getElementById('colorPicker');
const brushSize = document.getElementById('brushSize');
const sizeVal = document.getElementById('sizeVal');
brushSize.addEventListener('input', () => sizeVal.textContent = brushSize.value);

canvas.addEventListener('mousedown', e => { painting = true; [lastX, lastY] = [e.offsetX, e.offsetY]; if(tool==='fill') floodFill(e.offsetX, e.offsetY); else draw(e); });
canvas.addEventListener('mousemove', e => { if(painting && tool !== 'fill') draw(e); });
canvas.addEventListener('mouseup', () => painting = false);
canvas.addEventListener('mouseleave', () => painting = false);

canvas.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; const r = canvas.getBoundingClientRect(); painting = true; [lastX, lastY] = [t.clientX-r.left, t.clientY-r.top]; if(tool==='fill') floodFill(lastX,lastY); }, {passive:false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); if(!painting) return; const t = e.touches[0]; const r = canvas.getBoundingClientRect(); drawLine(t.clientX-r.left, t.clientY-r.top); }, {passive:false});
canvas.addEventListener('touchend', () => painting = false);

function draw(e) { drawLine(e.offsetX, e.offsetY); }
function drawLine(x, y) {
  ctx.beginPath();
  ctx.lineWidth = tool==='erase' ? brushSize.value*2 : brushSize.value;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = tool==='erase' ? '#ffffff' : colorPicker.value;
  ctx.globalCompositeOperation = tool==='erase' ? 'destination-out' : 'source-over';
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(x, y);
  ctx.stroke();
  [lastX, lastY] = [x, y];
  ctx.globalCompositeOperation = 'source-over';
}

function drawTree() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#0d1b2a');
  sky.addColorStop(1, '#1a2e4a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);

  // Stars
  ctx.fillStyle = 'white';
  for(let i=0; i<80; i++) {
    const sx = Math.random()*w, sy = Math.random()*h*0.6;
    const r = Math.random()*1.5+0.3;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
  }

  const cx = w/2, base = h*0.88;
  const treeH = h*0.65, treeW = w*0.38;

  // Trunk
  ctx.fillStyle = '#5c3d11';
  ctx.fillRect(cx-treeW*0.06, base, treeW*0.12, h*0.09);

  // Snow ground
  ctx.fillStyle = '#e8f4f8';
  ctx.beginPath();
  ctx.ellipse(cx, base+2, treeW*0.5, h*0.04, 0, 0, Math.PI*2);
  ctx.fill();

  // Tree layers (3 tiers)
  const layers = [
    { y: base,       w: treeW,      h: treeH*0.45 },
    { y: base-treeH*0.35, w: treeW*0.72, h: treeH*0.38 },
    { y: base-treeH*0.62, w: treeW*0.45, h: treeH*0.32 },
  ];
  layers.forEach(l => {
    const g = ctx.createLinearGradient(cx-l.w/2, 0, cx+l.w/2, 0);
    g.addColorStop(0, '#145a32'); g.addColorStop(0.5, '#27ae60'); g.addColorStop(1, '#145a32');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(cx, l.y - l.h);
    ctx.lineTo(cx + l.w/2, l.y);
    ctx.lineTo(cx - l.w/2, l.y);
    ctx.closePath();
    ctx.fill();
    // Snow on branches
    ctx.fillStyle = 'rgba(220,240,255,0.55)';
    ctx.beginPath();
    ctx.moveTo(cx, l.y - l.h);
    ctx.lineTo(cx + l.w*0.25, l.y - l.h*0.3);
    ctx.lineTo(cx - l.w*0.25, l.y - l.h*0.3);
    ctx.closePath();
    ctx.fill();
  });

  // Baubles (ornaments)
  const ornamentColors = ['#e74c3c','#f39c12','#3498db','#9b59b6','#e91e63','#ff9800'];
  const ornaments = [
    [cx-treeW*0.1, base-treeH*0.12],
    [cx+treeW*0.13, base-treeH*0.18],
    [cx-treeW*0.18, base-treeH*0.25],
    [cx+treeW*0.06, base-treeH*0.32],
    [cx-treeW*0.05, base-treeH*0.42],
    [cx+treeW*0.15, base-treeH*0.08],
  ];
  ornaments.forEach((o, i) => {
    ctx.fillStyle = ornamentColors[i % ornamentColors.length];
    ctx.beginPath(); ctx.arc(o[0], o[1], treeW*0.025, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.arc(o[0]-treeW*0.007, o[1]-treeW*0.007, treeW*0.008, 0, Math.PI*2); ctx.fill();
  });

  // Lights (glowing dots)
  const lightColors = ['#ffe066','#ff6b6b','#74c0fc','#a9e34b','#ff922b','#f8f0fc'];
  for(let i=0; i<30; i++) {
    const angle = Math.random()*Math.PI*2;
    const layer = Math.floor(Math.random()*3);
    const l = layers[layer];
    const ty = l.y - Math.random()*l.h*0.85;
    const frac = (ty - (l.y - l.h)) / l.h;
    const maxX = l.w/2 * (1-frac)*0.9;
    const tx = cx + (Math.random()*2-1)*maxX;
    const lc = lightColors[i % lightColors.length];
    ctx.shadowColor = lc; ctx.shadowBlur = 8;
    ctx.fillStyle = lc;
    ctx.beginPath(); ctx.arc(tx, ty, treeW*0.015, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Star on top
  const starY = base - treeH*0.7;
  drawStar(cx, starY, 5, treeW*0.07, treeW*0.03, '#ffd700');
}

function drawStar(cx, cy, spikes, outerR, innerR, color) {
  ctx.save();
  ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 20;
  ctx.fillStyle = color;
  ctx.beginPath();
  for(let i=0; i<spikes*2; i++) {
    const r = i%2===0 ? outerR : innerR;
    const a = (i * Math.PI) / spikes - Math.PI/2;
    i===0 ? ctx.moveTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r) : ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function addSnow() {
  for(let i=0; i<120; i++) {
    const x = Math.random()*canvas.width;
    const y = Math.random()*canvas.height;
    const r = Math.random()*4+1;
    ctx.fillStyle = `rgba(220,240,255,${Math.random()*0.7+0.3})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
}

function floodFill(startX, startY) {
  startX = Math.floor(startX); startY = Math.floor(startY);
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;
  const i = (startY*canvas.width+startX)*4;
  const targetR=data[i],targetG=data[i+1],targetB=data[i+2],targetA=data[i+3];
  const fillColor = hexToRgb(colorPicker.value);
  if(!fillColor) return;
  if(targetR===fillColor.r&&targetG===fillColor.g&&targetB===fillColor.b&&targetA===255) return;
  const stack = [[startX,startY]];
  while(stack.length) {
    const [x,y] = stack.pop();
    if(x<0||x>=canvas.width||y<0||y>=canvas.height) continue;
    const idx=(y*canvas.width+x)*4;
    if(data[idx]!==targetR||data[idx+1]!==targetG||data[idx+2]!==targetB||data[idx+3]!==targetA) continue;
    data[idx]=fillColor.r; data[idx+1]=fillColor.g; data[idx+2]=fillColor.b; data[idx+3]=255;
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  ctx.putImageData(imgData,0,0);
}

function hexToRgb(hex) {
  const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return r?{r:parseInt(r[1],16),g:parseInt(r[2],16),b:parseInt(r[3],16)}:null;
}

function clearCanvas() { drawTree(); }

function saveImage() {
  const link = document.createElement('a');
  link.download = 'weihnachtsbaum.png';
  link.href = canvas.toDataURL();
  link.click();
}

// --- Stempel ---
let currentStamp = null;
const stampSizeInput = document.getElementById('stampSize');

function setStamp(name) {
  currentStamp = name;
  tool = 'stamp';
  document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.stamp-btn').forEach(b => {
    if(b.getAttribute('onclick') === `setStamp('${name}')`) b.classList.add('active');
  });
}

canvas.addEventListener('click', e => {
  if(tool !== 'stamp' || !currentStamp) return;
  placeStamp(e.offsetX, e.offsetY);
});
canvas.addEventListener('touchstart', e => {
  if(tool !== 'stamp' || !currentStamp) return;
  e.preventDefault();
  const t = e.touches[0], r = canvas.getBoundingClientRect();
  placeStamp(t.clientX - r.left, t.clientY - r.top);
}, {passive:false});

function placeStamp(x, y) {
  const s = parseInt(stampSizeInput.value);
  const c = colorPicker.value;
  ctx.save();
  ctx.translate(x, y);
  switch(currentStamp) {
    case 'star':      stampStar(s, c); break;
    case 'snowflake': stampSnowflake(s, c); break;
    case 'bell':      stampBell(s, c); break;
    case 'candle':    stampCandle(s, c); break;
    case 'heart':     stampHeart(s, c); break;
    case 'gift1':     stampGift1(s, c); break;
    case 'gift2':     stampGift2(s, c); break;
    case 'gift3':     stampGift3(s, c); break;
  }
  ctx.restore();
}

function stampStar(s, c) {
  ctx.shadowColor = c; ctx.shadowBlur = 12;
  ctx.fillStyle = c;
  ctx.beginPath();
  for(let i=0; i<10; i++) {
    const r = i%2===0 ? s/2 : s/4.5;
    const a = (i*Math.PI/5) - Math.PI/2;
    i===0 ? ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r) : ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
  }
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
}

function stampSnowflake(s, c) {
  ctx.strokeStyle = c; ctx.lineWidth = s*0.07; ctx.lineCap = 'round';
  ctx.shadowColor = c; ctx.shadowBlur = 8;
  for(let i=0; i<6; i++) {
    ctx.save(); ctx.rotate(i*Math.PI/3);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-s/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-s*0.3); ctx.lineTo(s*0.12,-s*0.42); ctx.moveTo(0,-s*0.3); ctx.lineTo(-s*0.12,-s*0.42); ctx.stroke();
    ctx.restore();
  }
  ctx.shadowBlur = 0;
}

function stampBell(s, c) {
  ctx.fillStyle = c;
  ctx.shadowColor = c; ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(0, -s*0.1, s*0.08, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-s*0.38, s*0.25);
  ctx.quadraticCurveTo(-s*0.42, -s*0.35, 0, -s*0.35);
  ctx.quadraticCurveTo(s*0.42, -s*0.35, s*0.38, s*0.25);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.arc(0, s*0.32, s*0.1, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
}

function stampCandle(s, c) {
  ctx.fillStyle = c;
  ctx.fillRect(-s*0.18, -s*0.35, s*0.36, s*0.65);
  ctx.fillStyle = '#ffd700';
  ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.moveTo(0, -s*0.35);
  ctx.quadraticCurveTo(s*0.12, -s*0.55, 0, -s*0.65);
  ctx.quadraticCurveTo(-s*0.12, -s*0.55, 0, -s*0.35);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,200,100,0.3)';
  ctx.beginPath(); ctx.arc(0,-s*0.5, s*0.22, 0, Math.PI*2); ctx.fill();
}

function stampHeart(s, c) {
  ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(0, s*0.25);
  ctx.bezierCurveTo(-s*0.5, -s*0.1, -s*0.5, -s*0.5, 0, -s*0.25);
  ctx.bezierCurveTo(s*0.5, -s*0.5, s*0.5, -s*0.1, 0, s*0.25);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function stampGift1(s, c) {
  // Box with ribbon
  ctx.fillStyle = c;
  ctx.fillRect(-s*0.4, -s*0.25, s*0.8, s*0.55);
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(-s*0.06, -s*0.25, s*0.12, s*0.55);
  ctx.fillRect(-s*0.4, -s*0.05, s*0.8, s*0.1);
  // Lid
  ctx.fillStyle = '#ff6b6b';
  ctx.fillRect(-s*0.42, -s*0.35, s*0.84, s*0.14);
  // Bow
  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.ellipse(-s*0.15, -s*0.35, s*0.14, s*0.09, -0.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s*0.15, -s*0.35, s*0.14, s*0.09, 0.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath(); ctx.arc(0, -s*0.35, s*0.07, 0, Math.PI*2); ctx.fill();
}

function stampGift2(s, c) {
  // Rounder gift with polka dots
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.roundRect(-s*0.4,-s*0.3,s*0.8,s*0.6, s*0.1); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  [[-.2,-.1],[.15,.05],[-.05,.12],[.22,-.18]].forEach(([dx,dy])=>{
    ctx.beginPath(); ctx.arc(dx*s,dy*s,s*0.06,0,Math.PI*2); ctx.fill();
  });
  ctx.fillStyle = '#e91e63';
  ctx.fillRect(-s*0.07,-s*0.3,s*0.14,s*0.6);
  ctx.fillRect(-s*0.4,-s*0.07,s*0.8,s*0.14);
  ctx.beginPath(); ctx.arc(0,-s*0.3,s*0.1,0,Math.PI*2); ctx.fill();
}

function stampGift3(s, c) {
  // Simple box with tag
  ctx.fillStyle = c;
  ctx.strokeStyle = '#333'; ctx.lineWidth = s*0.04;
  ctx.beginPath(); ctx.rect(-s*0.38,-s*0.28,s*0.76,s*0.56); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#ffd700'; ctx.lineWidth = s*0.05;
  ctx.beginPath(); ctx.moveTo(0,-s*0.28); ctx.lineTo(0,s*0.28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-s*0.38,0); ctx.lineTo(s*0.38,0); ctx.stroke();
  // tag
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.roundRect(s*0.18,-s*0.42,s*0.25,s*0.2,s*0.04); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='#ccc'; ctx.lineWidth=s*0.03;
  ctx.beginPath(); ctx.moveTo(s*0.18,-s*0.32); ctx.lineTo(s*0.1,-s*0.28); ctx.stroke();
}

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>

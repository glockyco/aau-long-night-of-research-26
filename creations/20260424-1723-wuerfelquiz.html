<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Würfelquiz – Höher oder Tiefer?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
  }
  .game {
    text-align: center;
    padding: 40px;
    max-width: 500px;
    width: 100%;
  }
  h1 { font-size: 2.2em; margin-bottom: 8px; }
  .subtitle { color: #aaa; margin-bottom: 30px; font-size: 1.1em; }

  .score-bar {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-bottom: 30px;
    font-size: 1.1em;
  }
  .score-item span { font-size: 1.6em; font-weight: bold; }
  .score-item.richtig span { color: #4ade80; }
  .score-item.falsch span { color: #f87171; }
  .score-item.serie span { color: #facc15; }

  .dice-area {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
    margin: 30px 0;
  }
  .dice {
    width: 120px;
    height: 120px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    transition: transform 0.3s;
  }
  .dice.neu { animation: pop 0.4s ease; }
  @keyframes pop {
    0% { transform: scale(0.5) rotate(-15deg); opacity: 0; }
    70% { transform: scale(1.15) rotate(5deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .pfeil { font-size: 2.5em; color: #94a3b8; }

  .frage { font-size: 1.3em; margin-bottom: 20px; color: #cbd5e1; }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 25px;
  }
  button {
    padding: 16px 36px;
    font-size: 1.3em;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button:hover { transform: scale(1.07); }
  button:active { transform: scale(0.96); }
  .btn-hoeher { background: #22c55e; color: white; box-shadow: 0 4px 15px rgba(34,197,94,0.4); }
  .btn-tiefer { background: #ef4444; color: white; box-shadow: 0 4px 15px rgba(239,68,68,0.4); }
  .btn-gleich { background: #f59e0b; color: white; box-shadow: 0 4px 15px rgba(245,158,11,0.4); }

  .feedback {
    font-size: 1.6em;
    font-weight: bold;
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }
  .feedback.richtig { color: #4ade80; }
  .feedback.falsch { color: #f87171; }

  .serie-badge {
    display: inline-block;
    background: #facc15;
    color: #1a1a2e;
    border-radius: 20px;
    padding: 4px 16px;
    font-size: 0.9em;
    font-weight: bold;
    margin-top: 8px;
    min-height: 28px;
  }

  .neu-spiel-btn {
    margin-top: 20px;
    background: #6366f1;
    color: white;
    box-shadow: 0 4px 15px rgba(99,102,241,0.4);
    padding: 12px 28px;
    font-size: 1em;
    display: none;
  }
</style>
</head>
<body>
<div class="game">
  <h1>🎲 Höher oder Tiefer?</h1>
  <p class="subtitle">Ist die nächste Zahl höher, tiefer oder gleich?</p>

  <div class="score-bar">
    <div class="score-item richtig">✅ Richtig<br><span id="richtig">0</span></div>
    <div class="score-item falsch">❌ Falsch<br><span id="falsch">0</span></div>
    <div class="score-item serie">🔥 Serie<br><span id="serie">0</span></div>
  </div>

  <div class="dice-area">
    <div class="dice" id="aktuellerWuerfel"></div>
    <div class="pfeil">→</div>
    <div class="dice" id="naechsterWuerfel"></div>
  </div>

  <p class="frage">Was kommt als nächstes?</p>

  <div class="buttons">
    <button class="btn-tiefer" onclick="raten('tiefer')">⬇ Tiefer</button>
    <button class="btn-gleich" onclick="raten('gleich')">= Gleich</button>
    <button class="btn-hoeher" onclick="raten('hoeher')">⬆ Höher</button>
  </div>

  <div class="feedback" id="feedback"></div>
  <div class="serie-badge" id="serieBadge"></div>
  <button class="neu-spiel-btn" id="neuBtn" onclick="neuesSpiel()">🔄 Neues Spiel</button>
</div>

<script>
  const dotPositions = {
    1: [[50,50]],
    2: [[25,25],[75,75]],
    3: [[25,25],[50,50],[75,75]],
    4: [[25,25],[75,25],[25,75],[75,75]],
    5: [[25,25],[75,25],[50,50],[25,75],[75,75]],
    6: [[25,20],[75,20],[25,50],[75,50],[25,80],[75,80]]
  };

  function wuerfelSVG(zahl) {
    const dots = (dotPositions[zahl] || []).map(([x,y]) =>
      `<circle cx="${x}" cy="${y}" r="8" fill="#1e293b"/>`
    ).join('');
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
      <rect width="100" height="100" rx="18" ry="18" fill="white"/>
      ${dots}
    </svg>`;
  }

  function fragezeichenSVG() {
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
      <rect width="100" height="100" rx="18" ry="18" fill="#334155"/>
      <text x="50" y="68" text-anchor="middle" font-size="55" fill="#94a3b8" font-family="sans-serif">?</text>
    </svg>`;
  }

  let aktuell = 0;
  let naechste = 0;
  let richtig = 0, falsch = 0, serie = 0;
  let warteAufNaechste = false;

  function wuerfeln() {
    return Math.floor(Math.random() * 6) + 1;
  }

  function start() {
    aktuell = wuerfeln();
    document.getElementById('aktuellerWuerfel').innerHTML = wuerfelSVG(aktuell);
    document.getElementById('aktuellerWuerfel').className = 'dice';
    document.getElementById('naechsterWuerfel').innerHTML = fragezeichenSVG();
    document.getElementById('naechsterWuerfel').className = 'dice';
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('serieBadge').textContent = '';
    warteAufNaechste = false;
    setButtons(true);
    document.getElementById('neuBtn').style.display = 'none';
  }

  function raten(tipp) {
    if (warteAufNaechste) return;
    warteAufNaechste = true;
    setButtons(false);

    naechste = wuerfeln();
    const wuerfelEl = document.getElementById('naechsterWuerfel');
    wuerfelEl.innerHTML = wuerfelSVG(naechste);
    wuerfelEl.className = 'dice neu';

    let ergebnis;
    if (naechste > aktuell) ergebnis = 'hoeher';
    else if (naechste < aktuell) ergebnis = 'tiefer';
    else ergebnis = 'gleich';

    const feedbackEl = document.getElementById('feedback');
    const badgeEl = document.getElementById('serieBadge');

    if (tipp === ergebnis) {
      richtig++;
      serie++;
      feedbackEl.textContent = '✅ Richtig!';
      feedbackEl.className = 'feedback richtig';
      if (serie >= 3) {
        badgeEl.textContent = `🔥 ${serie}er-Serie!`;
      } else {
        badgeEl.textContent = '';
      }
    } else {
      falsch++;
      serie = 0;
      feedbackEl.textContent = '❌ Falsch!';
      feedbackEl.className = 'feedback falsch';
      badgeEl.textContent = '';
    }

    document.getElementById('richtig').textContent = richtig;
    document.getElementById('falsch').textContent = falsch;
    document.getElementById('serie').textContent = serie;

    setTimeout(() => {
      aktuell = naechste;
      document.getElementById('aktuellerWuerfel').innerHTML = wuerfelSVG(aktuell);
      document.getElementById('aktuellerWuerfel').className = 'dice neu';
      document.getElementById('naechsterWuerfel').innerHTML = fragezeichenSVG();
      document.getElementById('naechsterWuerfel').className = 'dice';
      feedbackEl.textContent = '';
      feedbackEl.className = 'feedback';
      badgeEl.textContent = '';
      warteAufNaechste = false;
      setButtons(true);
    }, 1400);
  }

  function setButtons(aktiv) {
    document.querySelectorAll('.buttons button').forEach(b => b.disabled = !aktiv);
  }

  function neuesSpiel() {
    richtig = 0; falsch = 0; serie = 0;
    document.getElementById('richtig').textContent = 0;
    document.getElementById('falsch').textContent = 0;
    document.getElementById('serie').textContent = 0;
    start();
  }

  start();
</script>
</body>
</html>
